    sb.from('c_contractors').select('*').eq('role','contractor').eq('status','active').order('first_name'),
    sb.from('c_contract_templates').select('*').eq('is_active', true).order('name')
  ]);
  if (error) { toast(error.message, {error:true}); return; }
  if (!(tpls||[]).length) { toast('No active templates. Add one under Manage templates.', {error:true}); return; }
  const who = (people||[]);
  const pick = contractorId || (who[0] && who[0].id);
  const fill = (c) => {
    if (!c) return;
    $('sc-contractor_name').value = `${c.first_name||''} ${c.last_name||''}`.trim();
    const addr = [c.address_line1, c.address_line2, [c.city, c.state].filter(Boolean).join(', ') + (c.postal_code ? ' ' + c.postal_code : '')].filter(s => s && s.trim()).join(', ');
    $('sc-contractor_address').value = addr;
    $('sc-pay_rate').value = Number(c.pay_rate||0).toFixed(2);
  };
  openModal('Send a contract for signature', `
    <div class="form-row">
      <div class="fg"><label>Contractor</label><select id="sc-contractor">${who.map(c => `<option value="${c.id}" ${c.id===pick?'selected':''}>${esc(c.first_name)} ${esc(c.last_name)}, ${esc(c.email)}</option>`).join('')}</select></div>
      <div class="fg"><label>Template</label><select id="sc-template">${tpls.map(t => `<option value="${t.id}">${esc(t.name)} (v${t.version})</option>`).join('')}</select></div>
    </div>
    <div class="form-row">
      <div class="fg"><label>Contractor legal name</label><input id="sc-contractor_name" /></div>
      <div class="fg"><label>Effective date</label><input id="sc-effective_date_iso" type="date" value="${todayISO()}" /></div>
    </div>
    <div class="fg"><label>Contractor address</label><input id="sc-contractor_address" placeholder="Street, City, ST ZIP" /></div>
    <div class="form-row">
      <div class="fg"><label>Pay rate ($/hr)</label><input id="sc-pay_rate" /></div>
      <div class="fg"><label>Company signer</label><input id="sc-company_signer" value="Jake Lazar" /><div class="help">Title: CEO. You are signing on behalf of LFB when you send.</div></div>
    </div>
    <div id="sc-preview-wrap" style="margin-top:10px;"></div>
    <p style="font-size:.78rem;color:var(--muted);margin-top:8px;">The contractor will see an "Action needed" banner when they next sign in. Email notification goes out once EmailJS is enabled.</p>
  `, [
    { label:'Cancel', cls:'btn-outline', onClick: closeModal },
    { label:'Preview', cls:'btn-outline', onClick: () => {
      const { body, missing } = buildContractBody();
      $('sc-preview-wrap').innerHTML = `${missing.length ? `<p style="color:var(--danger);font-size:.82rem;">Unfilled fields: ${esc(missing.join(', '))}</p>` : ''}<div class="ct-wrap" style="max-height:320px;overflow:auto;border:1px solid var(--tan);border-radius:6px;padding:12px;background:var(--white);"><div class="ct-doc">${contractToHtml(body)}</div></div>`;
    }},
    { label:'Sign & send', cls:'btn-primary', onClick: async () => {
      const { body, missing, merge, tpl } = buildContractBody();
      if (missing.length) { toast('Fill in: ' + missing.join(', '), {error:true}); return; }
      const cid = $('sc-contractor').value;
      const { data: newId, error: e } = await sb.rpc('c_contract_send', { p_contractor_id: cid, p_template_id: tpl.id, p_title: tpl.name, p_body: body, p_merge: merge, p_company_signer: v('sc-company_signer') || 'Jake Lazar', p_company_title: 'CEO' });
      if (e) { toast(e.message, {error:true}); return; }
      const person = who.find(p => p.id === cid);
      notify('contract_sent', { to_email: person?.email, contractor_name: merge.contractor_name, contract_title: tpl.name, portal_url: PORTAL_URL });
      toast(`Sent to ${person?.first_name||'contractor'} for signature`);
      closeModal(); showSection('a-contracts');
    }}
  ]);
  $('generic-modal').querySelector('.modal').classList.add('modal-wide');
  function buildContractBody() {
    const tpl = tpls.find(t => t.id === $('sc-template').value);
    const rateRaw = v('sc-pay_rate').replace(/[^0-9.]/g,'');
    const merge = {
      contractor_name:    v('sc-contractor_name'),
      contractor_address: v('sc-contractor_address'),
      effective_date:     fmtLongDate(v('sc-effective_date_iso')),
      pay_rate:           rateRaw ? `$${Number(rateRaw).toFixed(2)}` : '',
      company_signer:     v('sc-company_signer') || 'Jake Lazar',
      company_title:      'CEO'
    };
    const body = contractMerge(tpl.body, merge);
    return { body, missing: contractUnfilled(body), merge, tpl };
  }
  $('sc-contractor').onchange = () => fill(who.find(p => p.id === $('sc-contractor').value));
  fill(who.find(p => p.id === pick));
};

// Admin: file an already-signed contract (paper / email e-sign) against a contractor.
window.openUploadSignedContractModal = async function(contractorId) {
  const { data: people } = await sb.from('c_contractors').select('id,first_name,last_name,email').eq('role','contractor').order('first_name');
  const who = people || [];
  openModal('Upload a signed contract', `
    <p style="font-size:.86rem;color:var(--muted);margin:0 0 10px;">For agreements that were already signed outside the portal (emailed PDF, paper). The file is stored in the contractor's private documents and shows as <strong>Signed</strong> in the Contracts list.</p>
    <div class="form-row">
      <div class="fg"><label>Contractor</label><select id="uc-contractor">${who.map(c => `<option value="${c.id}" ${c.id===contractorId?'selected':''}>${esc(c.first_name)} ${esc(c.last_name)}, ${esc(c.email)}</option>`).join('')}</select></div>
      <div class="fg"><label>Date signed</label><input id="uc-date" type="date" value="${todayISO()}" /></div>
    </div>
    <div class="form-row">
      <div class="fg"><label>Agreement title</label><input id="uc-title" value="Independent Contractor Agreement" /></div>
      <div class="fg"><label>How it was signed</label><select id="uc-method"><option value="email_esign">E-signed PDF returned by email</option><option value="paper">Paper / wet ink (scanned)</option><option value="other">Other</option></select></div>
    </div>
    <div class="fg"><label>Signed PDF</label><input id="uc-file" type="file" accept="application/pdf,image/*" /></div>
    <div class="fg"><label>Notes (optional)</label><input id="uc-notes" placeholder="e.g. returned via Gmail thread 'LFB ICA' on May 22" /></div>
  `, [
    { label:'Cancel', cls:'btn-outline', onClick: closeModal },
    { label:'Upload & file', cls:'btn-primary', onClick: async () => {
      const file = $('uc-file').files[0];
      const cid = $('uc-contractor').value; const person = who.find(p => p.id === cid);
      if (!file) { toast('Choose the signed PDF first', {error:true}); return; }
      if (file.size > 15*1024*1024) { toast('File too large (15 MB max)', {error:true}); return; }
      const btns = $('generic-modal-actions').querySelectorAll('button'); btns.forEach(b => b.disabled = true);
      try {
        const buf = await file.arrayBuffer();
        const sha = [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))].map(b => b.toString(16).padStart(2,'0')).join('');
        const safe = file.name.replace(/[^\w.\-]/g,'_');
        const path = `${cid}/contracts/imported-${Date.now()}-${safe}`;
        const { error: upErr } = await sb.storage.from('contractor-documents').upload(path, file, { upsert:false, contentType: file.type || 'application/pdf' });
        if (upErr) throw upErr;
        const signedAt = new Date(v('uc-date') + 'T12:00:00').toISOString();
        const method = $('uc-method').value;
        const { data: row, error: insErr } = await sb.from('c_contracts').insert({
          contractor_id: cid, title: v('uc-title') || 'Independent Contractor Agreement',
          body_rendered: `[Imported signed document: ${file.name}]\n\nThis agreement was signed outside the portal (${method.replace('_',' ')}) on ${v('uc-date')} and uploaded by an administrator. The signed file is attached; its SHA-256 fingerprint is ${sha}.` + (v('uc-notes') ? `\n\nNotes: ${v('uc-notes')}` : ''),
          body_sha256: sha, merge_values: { imported:true, method, original_filename: file.name, notes: v('uc-notes') },
          status:'signed', signed_at: signedAt, signer_typed_name: `${person?.first_name||''} ${person?.last_name||''}`.trim(),
          signer_email: person?.email || null, consent_text: 'Signed outside the portal; see attached document.',
          company_signed_at: signedAt, pdf_path: path, created_by: session.contractor.id
        }).select().single();
        if (insErr) throw insErr;
        await sb.from('c_documents').insert({ contractor_id: cid, document_type:'contract', file_path: path, file_name: file.name, file_size_bytes: file.size, mime_type: file.type || 'application/pdf', uploaded_by: session.contractor.id });
        toast(`Filed signed contract for ${person?.first_name||'contractor'}`);
        closeModal(); showSection('a-contracts');
      } catch (e) { toast(e.message || 'Upload failed', {error:true}); btns.forEach(b => b.disabled = false); }
    }}
  ]);
};

// Admin: drop several already-signed PDFs at once. Matches each file to a
// contractor by the name in the filename (e.g. 20260519_ICA_TaliaRichland.pdf).
window.openBulkImportContractsModal = async function() {
  const { data: people } = await sb.from('c_contractors').select('id,first_name,last_name,email').eq('role','contractor').order('first_name');
  const who = people || [];
  const norm = s => String(s||'').toLowerCase().replace(/[^a-z]/g,'');
  const guess = (fname) => {
    const base = fname.replace(/\.[^.]+$/,'');
    const after = base.includes('ICA_') ? base.split('ICA_')[1] : base;
    const key = norm(after.replace(/_?signed$/i,''));
    let best = who.find(p => key === norm(p.first_name + p.last_name));
    if (!best) best = who.find(p => key.startsWith(norm(p.first_name)) && key.includes(norm(p.last_name).slice(0,4)));
    if (!best) best = who.find(p => key.includes(norm(p.first_name)) && norm(p.first_name).length > 2);
    const m = base.match(/^(\d{4})(\d{2})(\d{2})/);
    const date = m ? `${m[1]}-${m[2]}-${m[3]}` : todayISO();
    const title = /consult/i.test(base) ? 'Consulting Agreement' : /nda|confidential/i.test(base) ? 'Non-Disclosure Agreement' : 'Independent Contractor Agreement';
    return { contractorId: best ? best.id : '', date, title };
  };
  let files = [];
  openModal('Bulk import signed contracts', `
    <p style="font-size:.86rem;color:var(--muted);margin:0 0 10px;">Select all the signed PDFs at once. I'll match each one to a contractor from its filename; fix any that are wrong, then import. Each becomes a <strong>Signed</strong> contract with the file attached.</p>
    <div class="fg"><label>Signed PDFs</label><input id="bi-files" type="file" accept="application/pdf" multiple /></div>
    <div id="bi-table" style="margin-top:10px;"></div>
    <div id="bi-progress" style="font-size:.82rem;color:var(--muted);margin-top:8px;"></div>
  `, [
    { label:'Cancel', cls:'btn-outline', onClick: closeModal },
    { label:'Import all', cls:'btn-primary', onClick: async () => {
      if (!files.length) { toast('Choose the PDFs first', {error:true}); return; }
      const rows = files.map((f, i) => ({ file: f, cid: $(`bi-c-${i}`).value, date: $(`bi-d-${i}`).value, title: v(`bi-t-${i}`) || 'Independent Contractor Agreement' }));
      const bad = rows.filter(r => !r.cid);
      if (bad.length) { toast(`${bad.length} file(s) have no contractor selected`, {error:true}); return; }
      const btns = $('generic-modal-actions').querySelectorAll('button'); btns.forEach(b => b.disabled = true);
      let ok = 0, fail = 0;
      for (const r of rows) {
        $('bi-progress').textContent = `Importing ${r.file.name}…`;
        try {
          const person = who.find(p => p.id === r.cid);
          const buf = await r.file.arrayBuffer();
          const sha = [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))].map(b => b.toString(16).padStart(2,'0')).join('');
          const safe = r.file.name.replace(/[^\w.\-]/g,'_');
          const path = `${r.cid}/contracts/imported-${Date.now()}-${safe}`;
          const { error: upErr } = await sb.storage.from('contractor-documents').upload(path, r.file, { upsert:false, contentType:'application/pdf' });
          if (upErr) throw upErr;
          const signedAt = new Date(r.date + 'T12:00:00').toISOString();
          const { error: insErr } = await sb.from('c_contracts').insert({
            contractor_id: r.cid, title: r.title,
            body_rendered: `[Imported signed document: ${r.file.name}]\n\nThis agreement was signed outside the portal (e-signed PDF returned by email) on ${r.date} and imported by an administrator. The signed file is attached; its SHA-256 fingerprint is ${sha}.`,
            body_sha256: sha, merge_values: { imported:true, method:'email_esign', original_filename: r.file.name },
            status:'signed', signed_at: signedAt, signer_typed_name: `${person?.first_name||''} ${person?.last_name||''}`.trim(),
            signer_email: person?.email || null, consent_text:'Signed outside the portal; see attached document.',
            company_signed_at: signedAt, pdf_path: path, created_by: session.contractor.id
          });
          if (insErr) throw insErr;
          await sb.from('c_documents').insert({ contractor_id: r.cid, document_type:'contract', file_path: path, file_name: r.file.name, file_size_bytes: r.file.size, mime_type:'application/pdf', uploaded_by: session.contractor.id });
          ok++;
        } catch (e) { fail++; console.warn('import failed', r.file.name, e); }
      }
      $('bi-progress').textContent = `Done: ${ok} imported${fail ? `, ${fail} failed (see console)` : ''}.`;
      toast(`Imported ${ok} signed contract${ok===1?'':'s'}`);
      setTimeout(() => { closeModal(); showSection('a-contracts'); }, 900);
    }}
  ]);
  $('generic-modal').querySelector('.modal').classList.add('modal-wide');
  $('bi-files').onchange = () => {
    files = [...$('bi-files').files];
    $('bi-table').innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>File</th><th>Contractor</th><th>Agreement</th><th>Date signed</th></tr></thead><tbody>
      ${files.map((f, i) => { const g = guess(f.name); return `<tr>
        <td style="font-size:.8rem;">${esc(f.name)}<div style="color:var(--muted);font-size:.72rem;">${(f.size/1024).toFixed(0)} KB</div></td>
        <td><select id="bi-c-${i}" style="font-size:.84rem;"><option value="">pick one</option>${who.map(p => `<option value="${p.id}" ${p.id===g.contractorId?'selected':''}>${esc(p.first_name)} ${esc(p.last_name)}</option>`).join('')}</select>${g.contractorId ? '' : '<div style="color:var(--danger);font-size:.72rem;">No match: add them under Contractors first, or pick manually</div>'}</td>
        <td><input id="bi-t-${i}" value="${esc(g.title)}" style="font-size:.84rem;min-width:170px;" /></td>
        <td><input id="bi-d-${i}" type="date" value="${g.date}" style="font-size:.84rem;" /></td>
      </tr>`; }).join('')}
    </tbody></table></div>`;
  };
};

// Tracks rent income from outside kitchen users (manual entry).
// ============================================================
async function renderAdminKitchenRent() {
  const el = $('sec-a-kitchenrent');
  el.innerHTML = '<div class="page-h">Kitchen Rent</div><div class="page-sub">Loading…</div>';

  const { data: rows, error } = await sb.from('c_kitchen_rent')
    .select('*')
    .order('period_start', { ascending: false })
    .order('created_at',   { ascending: false });

  if (error) {
    el.innerHTML = `<div class="page-h">Kitchen Rent</div>
      <p style="color:var(--warn);">${esc(error.message)}</p>
      <p style="font-size:.82rem;color:var(--muted);">
        If you just deployed, run <code>supabase/migrations/005_kitchen_rent_schema.sql</code> in the Supabase SQL Editor.</p>`;
    return;
  }

  const today = todayISO();
  const all = rows || [];
  let outstanding = 0, collectedYTD = 0, dueThisMonth = 0;
  const yearStart = today.slice(0,4) + '-01-01';
  const monthStart = today.slice(0,7) + '-01';
  for (const r of all) {
    const due  = Number(r.amount_due  || 0);
    const paid = Number(r.amount_paid || 0);
    const remaining = Math.max(0, due - paid);
    if (r.status !== 'cancelled') outstanding += remaining;
    if (r.paid_on && r.paid_on >= yearStart) collectedYTD += paid;
    if (r.period_start >= monthStart && r.period_start < addMonthsISO(monthStart, 1)) dueThisMonth += due;
  }

  const kentHtml = await renderKentKitchenPanel();
  el.innerHTML = `
    <div class="page-h">Kitchen</div>
    <div class="page-sub">Kent Denver kitchen hours we owe, and rent collected from outside users</div>

    ${kentHtml}

    <div class="page-h" style="font-size:1.25rem;margin-top:26px;">Rent collected</div>
    <div class="page-sub">Manual log of rent from outside kitchen users</div>

    ${outstanding > 0 ? `
      <div class="panel" style="border-left:4px solid var(--warn);background:var(--warn-bg);">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">
          <div>
            <div style="font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:#7d6608;font-weight:700;">Outstanding rent</div>
            <div style="font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:700;color:var(--brown-dk);line-height:1.1;margin-top:4px;">${fmtCur(outstanding)}</div>
          </div>
        </div>
      </div>
    ` : ''}

    <div class="stats-grid">
      <div class="stat-card"><div class="sl">Collected YTD</div><div class="sv">${fmtCur(collectedYTD)}</div></div>
      <div class="stat-card"><div class="sl">Due this month</div><div class="sv">${fmtCur(dueThisMonth)}</div></div>
      <div class="stat-card"><div class="sl">Entries</div><div class="sv">${all.length}</div></div>
    </div>

    <div class="panel-actions" style="margin:14px 0;">
      <button class="btn btn-primary" onclick="openKitchenRentModal()">+ Add rent entry</button>
    </div>

    <div class="panel">
      <div class="panel-title">All entries</div>
      ${all.length === 0 ? '<p style="color:var(--muted);font-size:.9rem;">No rent entries yet. Add one to get started.</p>' : `
        <div class="tbl-wrap"><table>
          <thead><tr><th>Period</th><th>Payer</th><th>Due</th><th>Paid</th><th>Balance</th><th>Status</th><th>Paid on</th><th></th></tr></thead>
          <tbody>
            ${all.map(r => {
              const balance = Math.max(0, Number(r.amount_due||0) - Number(r.amount_paid||0));
              const badgeCls = r.status === 'paid' ? 'b-paid'
                            : r.status === 'overdue' ? 'b-warn'
                            : r.status === 'partial' ? 'b-active'
                            : r.status === 'cancelled' ? 'b-inactive'
                            : 'b-pending';
              return `
                <tr>
                  <td style="white-space:nowrap;">${esc(fmtDateShort(r.period_start))}${r.period_end ? ' → '+esc(fmtDateShort(r.period_end)) : ''}</td>
                  <td><strong>${esc(r.payer_name||'')}</strong>${r.contact ? `<div style="font-size:.74rem;color:var(--muted);">${esc(r.contact)}</div>` : ''}</td>
                  <td>${fmtCur(r.amount_due||0)}</td>
                  <td>${fmtCur(r.amount_paid||0)}</td>
                  <td><strong>${fmtCur(balance)}</strong></td>
                  <td><span class="badge ${badgeCls}">${esc(r.status)}</span></td>
                  <td>${r.paid_on ? esc(fmtDateShort(r.paid_on)) : '-'}</td>
                  <td>
                    ${r.status !== 'paid' && r.status !== 'cancelled'
                      ? `<button class="btn btn-primary btn-sm" onclick="openKitchenRentPay('${r.id}')">Mark paid</button>` : ''}
                    <button class="btn btn-outline btn-sm" onclick="openKitchenRentModal('${r.id}')">Edit</button>
                    <button class="btn btn-outline btn-sm" onclick="deleteKitchenRent('${r.id}')">Delete</button>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table></div>
      `}
    </div>
  `;
}

// ADMIN, KENT DENVER KITCHEN HOURS (what LFB pays Kent, $10/hr)
// ============================================================
async function renderKentKitchenPanel() {
  const { data: rows, error } = await sb.from('c_kitchen_hours').select('*').order('use_date', { ascending:false });
  if (error) return `<p style="font-size:.82rem;color:var(--muted);">Kitchen hours table not found. Run <code>supabase/migrations/007_import_kent_tracker.sql</code>.</p>`;
  const all = rows || [];
  const today = todayISO(), yearStart = today.slice(0,4)+'-01-01', monthStart = today.slice(0,7)+'-01';
  let hrsYTD=0, owedYTD=0, unpaid=0, hrsMonth=0, owedMonth=0, hrsAll=0, owedAll=0;
  const byMonth = {};
  for (const r of all) {
    const h = Number(r.hours||0), t = Number(r.total||0);
    hrsAll += h; owedAll += t;
    if (r.use_date >= yearStart) { hrsYTD += h; owedYTD += t; }
    if (r.use_date >= monthStart) { hrsMonth += h; owedMonth += t; }
    if (!r.paid) unpaid += t;
    const k = r.use_date.slice(0,7); byMonth[k] = byMonth[k] || { hours:0, total:0, n:0, unpaid:0 };
    byMonth[k].hours += h; byMonth[k].total += t; byMonth[k].n++; if (!r.paid) byMonth[k].unpaid += t;
  }
  const months = Object.keys(byMonth).sort().reverse();
  const monthLabel = k => new Date(k+'-15T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});
  return `
    <div class="panel" style="border-left:4px solid var(--accent);">
      <div class="panel-title">Kent Denver kitchen · $10 per hour</div>
      <div class="stats-grid">
        <div class="stat-card"><div class="sl">Hours this month</div><div class="sv">${hrsMonth.toFixed(2)}</div><div class="sh">${fmtCur(owedMonth)}</div></div>
        <div class="stat-card"><div class="sl">Hours ${today.slice(0,4)} YTD</div><div class="sv">${hrsYTD.toFixed(2)}</div><div class="sh">${fmtCur(owedYTD)}</div></div>
        <div class="stat-card"><div class="sl">Not yet paid to Kent</div><div class="sv">${fmtCur(unpaid)}</div><div class="sh">${all.filter(r=>!r.paid).length} entr${all.filter(r=>!r.paid).length===1?'y':'ies'}</div></div>
        <div class="stat-card"><div class="sl">All time</div><div class="sv">${hrsAll.toFixed(1)} h</div><div class="sh">${fmtCur(owedAll)} · ${all.length} entries</div></div>
      </div>
      <div class="panel-actions" style="margin:12px 0 6px;">
        <button class="btn btn-primary" onclick="openKitchenHoursModal()">+ Log kitchen hours</button>
        <button class="btn btn-outline" onclick="toggleKentDetail()">Show / hide all entries</button>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Month</th><th>Bakes</th><th>Hours</th><th>Owed</th><th>Unpaid</th><th></th></tr></thead>
        <tbody>${months.map(k => `<tr>
          <td><strong>${esc(monthLabel(k))}</strong></td><td>${byMonth[k].n}</td><td>${byMonth[k].hours.toFixed(2)}</td><td>${fmtCur(byMonth[k].total)}</td>
          <td>${byMonth[k].unpaid > 0 ? `<span class="badge b-warn">${fmtCur(byMonth[k].unpaid)}</span>` : '<span class="badge b-paid">paid</span>'}</td>
          <td>${byMonth[k].unpaid > 0 ? `<button class="btn btn-outline btn-sm" onclick="markKentMonthPaid('${k}')">Mark month paid</button>` : ''}</td>
        </tr>`).join('') || '<tr><td class="empty-row" colspan="6">No kitchen hours logged yet</td></tr>'}</tbody>
      </table></div>
      <div id="kent-detail" style="display:none;margin-top:12px;">
        <div class="tbl-wrap"><table>
          <thead><tr><th>Date</th><th>Hours</th><th>Rate</th><th>Total</th><th>Batch</th><th>Paid</th><th></th></tr></thead>
          <tbody>${all.map(r => `<tr>
            <td style="white-space:nowrap;">${esc(fmtDateShort(r.use_date))}</td><td>${Number(r.hours).toFixed(2)}</td><td>${fmtCur(r.rate)}</td><td>${fmtCur(r.total)}</td>
            <td>${esc(r.batch||'-')}</td><td>${r.paid ? `<span class="badge b-paid">paid${r.paid_on ? ' '+esc(fmtDateShort(r.paid_on)) : ''}</span>` : '<span class="badge b-pending">open</span>'}</td>
            <td style="white-space:nowrap;"><button class="btn btn-outline btn-sm" onclick="openKitchenHoursModal('${r.id}')">Edit</button> <button class="btn btn-outline btn-sm" onclick="deleteKitchenHours('${r.id}')">Delete</button></td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div>
    </div>`;
}

window.markKentMonthPaid = async function(ym) {
  if (!confirm(`Mark all ${ym} kitchen hours as paid to Kent?`)) return;
  const { error } = await sb.from('c_kitchen_hours').update({ paid: true, paid_on: todayISO() }).gte('use_date', ym+'-01').lt('use_date', addMonthsISO(ym+'-01', 1)).eq('paid', false);
  if (error) { toast(error.message, {error:true}); return; }
  toast('Marked paid'); refreshActiveSection();
};
window.deleteKitchenHours = async function(id) {
  if (!confirm('Delete this kitchen hours entry?')) return;
  const { error } = await sb.from('c_kitchen_hours').delete().eq('id', id);
  if (error) { toast(error.message, {error:true}); return; }
  refreshActiveSection();
};

function addMonthsISO(iso, n) {
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y, (m-1)+n, d||1));
  return dt.toISOString().slice(0,10);
}

window.openKitchenRentModal = async function(id) {
  let row = null;
  if (id) {

    </div>
    <div class="form-row">
      <div class="fg"><label>Method</label><select id="kr-method">
        ${['','check','venmo','zelle','cash','wire','other']
          .map(m => `<option value="${m}" ${row?.method===m?'selected':''}>${m||'-'}</option>`).join('')}
      </select></div>
      <div class="fg"><label>Reference (check #, txn id)</label><input id="kr-ref" value="${esc(row?.reference||'')}" /></div>
    </div>
    <div class="form-row">
      <div class="fg"><label>Notes</label><textarea id="kr-notes" rows="2">${esc(row?.notes||'')}</textarea></div>
    </div>
  `, [
    { label:'Cancel', cls:'btn-outline', onClick: closeModal },
    { label: id ? 'Save changes' : 'Add entry', cls:'btn-primary', onClick: async () => {
      const payload = {
        payer_name:   v('kr-payer'),
        contact:      v('kr-contact'),
        period_start: v('kr-pstart'),
        period_end:   v('kr-pend')   || null,
        amount_due:   Number(v('kr-due')  || 0),
        amount_paid:  Number(v('kr-paid') || 0),
        status:       $('kr-status').value,
        paid_on:      v('kr-paidon') || null,
        method:       $('kr-method').value,

        notes:        v('kr-notes')
      };
      if (!payload.payer_name) { toast('Payer name required', {error:true}); return; }
      if (!payload.period_start) { toast('Period start required', {error:true}); return; }
      try {
        const q = id
          ? sb.from('c_kitchen_rent').update(payload).eq('id', id)
          : sb.from('c_kitchen_rent').insert(payload);

        if (error) throw error;
        closeModal();
        toast(id ? 'Saved' : 'Added');
        refreshActiveSection();
      } catch (e) { toast(e.message || 'Save failed', {error:true}); }

window.openKitchenRentPay = async function(id) {
  const { data: row, error } = await sb.from('c_kitchen_rent').select('*').eq('id', id).single();
  if (error) { toast(error.message, {error:true}); return; }
  const balance = Math.max(0, Number(row.amount_due||0) - Number(row.amount_paid||0));
  openModal(`Mark paid, ${row.payer_name}`, `
    <p style="font-size:.86rem;color:var(--muted);margin-bottom:10px;">Outstanding: <strong>${fmtCur(balance)}</strong></p>
    <div class="form-row">
      <div class="fg"><label>Amount received</label><input id="krp-amt" type="number" step="0.01" min="0" value="${balance.toFixed(2)}" inputmode="decimal" /></div>
      <div class="fg"><label>Method</label><select id="krp-method">
        ${['check','venmo','zelle','cash','wire','other']
          .map(m => `<option value="${m}" ${row.method===m?'selected':''}>${m}</option>`).join('')}
      </select></div>
    </div>
    <div class="form-row">
      <div class="fg"><label>Paid on</label><input id="krp-date" type="date" value="${todayISO()}" /></div>
      <div class="fg"><label>Reference</label><input id="krp-ref" value="${esc(row.reference||'')}" /></div>
    </div>
    <div class="form-row">
      <div class="fg"><label>Notes</label><textarea id="krp-notes" rows="2">${esc(row.notes||'')}</textarea></div>
    </div>
  `, [
    { label:'Cancel', cls:'btn-outline', onClick: closeModal },
    { label:'Record', cls:'btn-primary', onClick: async () => {
      const addAmt = Number(v('krp-amt') || 0);
      const newPaid = Number(row.amount_paid||0) + addAmt;
      const due = Number(row.amount_due||0);
      const newStatus = newPaid >= due ? 'paid' : (newPaid > 0 ? 'partial' : row.status);
      try {
        const { error } = await sb.from('c_kitchen_rent').update({
          amount_paid: newPaid,
          status:      newStatus,
          paid_on:     v('krp-date'),
          method:      $('krp-method').value,
          reference:   v('krp-ref'),
          notes:       v('krp-notes')
        }).eq('id', id);
        if (error) throw error;
        closeModal();
        toast('Payment recorded');
        refreshActiveSection();
      } catch (e) { toast(e.message || 'Update failed', {error:true}); }
    }}
  ]);
};

window.openContractorHistory = async function(contractorId) {
  openModal('Loading history...', '<p style="color:var(--muted);">Fetching...</p>', [
    { label:'Close', cls:'btn-outline', onClick: closeModal }
  ]);
  const [contractor, hours, payments] = await Promise.all([
    sb.from('c_contractors').select('*').eq('id', contractorId).single().then(r => r.data),
    sb.from('c_hour_submissions').select('*, shift:c_shifts(bake_date, location)').eq('contractor_id', contractorId).order('approved_at', { ascending: false, nullsFirst: false }),
    sb.from('c_payments').select('*').eq('contractor_id', contractorId).order('paid_on', { ascending: false })
  ]);
  const hoursRows = hours.data || [];
  const payRows = payments.data || [];
  const totalHours = hoursRows.reduce((s,h) => s + (h.status==='approved' ? Number(h.approved_hours||0) : 0), 0);
  const totalEarned = hoursRows.reduce((s,h) => s + (h.status==='approved' ? Number(h.approved_amount||0) : 0), 0);
  const totalPaid = payRows.reduce((s,p) => s + Number(p.amount||0), 0);
  const timeline = [];
  hoursRows.forEach(h => {
    timeline.push({
      date: h.approved_at || h.submitted_at,
      sortKey: h.approved_at || h.submitted_at,
      type: 'hours',
      label: `${h.approved_hours||h.submitted_hours} hrs · ${h.shift ? fmtDateShort(h.shift.bake_date) + ' bake' : 'shift'}`,
      amount: h.status==='approved' ? Number(h.approved_amount||0) : null,
      status: h.status
    });
  });
  payRows.forEach(p => {
    timeline.push({
      date: p.paid_on,
      sortKey: p.paid_on + 'T23:00:00',
      type: 'payment',
      label: `Paid · ${p.method}${p.reference ? ' · ' + p.reference : ''}`,
      amount: -Number(p.amount||0),
      status: 'paid'
    });
  });
  timeline.sort((a,b) => (b.sortKey||'').localeCompare(a.sortKey||''));

  openModal(`${contractor.first_name||''} ${contractor.last_name||''}, Full history`, `
    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;">
      <div class="stat-card" style="border-top-color:var(--accent);"><div class="sl">Total hours</div><div class="sv">${totalHours.toFixed(1)}</div></div>
      <div class="stat-card" style="border-top-color:var(--accent);"><div class="sl">Total earned</div><div class="sv">${fmtCur(totalEarned)}</div></div>
      <div class="stat-card" style="border-top-color:var(--accent);"><div class="sl">Total paid</div><div class="sv">${fmtCur(totalPaid)}</div></div>
    </div>
    ${Math.abs(totalEarned - totalPaid) > 0.01 ? `
      <p style="font-size:.84rem;color:${totalEarned > totalPaid ? 'var(--danger)' : 'var(--muted)'};">
        ${totalEarned > totalPaid ? `Currently owed: <strong>${fmtCur(totalEarned - totalPaid)}</strong>` : `Overpaid by: ${fmtCur(totalPaid - totalEarned)}`}
      </p>
    ` : ''}
    <div style="font-weight:700;font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--brown-dk);margin:14px 0 6px;">Timeline</div>
    ${timeline.length === 0 ? '<p style="color:var(--muted);font-size:.9rem;">No history yet.</p>' : `
      <div style="max-height:50vh;overflow-y:auto;border:1px solid var(--tan);border-radius:4px;">
        ${timeline.map(t => `
          <div style="padding:8px 12px;border-bottom:1px solid var(--cream-dk);display:flex;align-items:center;gap:10px;font-size:.86rem;">
            <span style="min-width:80px;color:var(--muted);font-size:.78rem;">${esc(fmtDateShort(t.date))}</span>
            <span style="flex:1;color:var(--brown-dk);">${esc(t.label)}</span>
            ${t.amount !== null ? `<span style="font-weight:700;color:${t.amount < 0 ? 'var(--accent-dk)' : 'var(--brown-dk)'};min-width:90px;text-align:right;">${t.amount < 0 ? '-' : ''}${fmtCur(Math.abs(t.amount))}</span>` : '<span></span>'}
            <span style="min-width:80px;text-align:right;"><span class="badge b-${t.status==='paid'?'paid':t.status==='approved'?'approved':'pending'}" style="font-size:.66rem;">${esc(t.status)}</span></span>
          </div>
        `).join('')}
      </div>
    `}
  `, [
    { label:'Close', cls:'btn-outline', onClick: closeModal },
    { label:'Edit contractor', cls:'btn-primary', onClick: () => { closeModal(); openEditContractorModal(contractorId); }}
  ]);
};

// ============================================================
// MULTI-START helpers + admin promote tentative
// ============================================================
function startTimesCap() {
  // Cap how many start times you can stack: one per spot.
  const spots = Math.max(1, parseInt(v('ns-spots') || '1', 10));
  return spots;
}
function currentStartCount() {
  return 1 + document.querySelectorAll('.ns-extra-start').length;
}
function refreshStartTimesUi() {
  const cap = startTimesCap();
  const current = currentStartCount();
  const btn = document.getElementById('ns-add-start-btn');
  const info = document.getElementById('ns-start-count');
  if (btn) {
    btn.disabled = current >= cap;
    btn.textContent = current >= cap
      ? `+ Add another start time (cap reached: ${cap} spots = ${cap} start times)`
      : `+ Add another start time`;
    btn.style.opacity = current >= cap ? '.55' : '1';
  }
  if (info) info.textContent = `${current} of ${cap} start time${cap===1?'':'s'} (one per spot)`;
}
window.addStartTimeRow = function() {
  const container = document.getElementById('ns-extra-starts');
  if (!container) return;
  if (currentStartCount() >= startTimesCap()) {
    toast(`You have ${startTimesCap()} spot${startTimesCap()===1?'':'s'}, that's the max number of stacked start times. Increase Spots to add more.`, {error:true});
    return;
  }
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:6px;align-items:center;margin-top:6px;';
  row.innerHTML = `
    <input type="time" class="ns-extra-start" style="padding:8px 10px;border:1px solid var(--tan);border-radius:4px;flex:1;" onchange="refreshStartTimesUi()" />
    <button type="button" onclick="this.parentNode.remove();refreshStartTimesUi();" style="background:none;border:none;color:var(--danger);font-size:1.2rem;cursor:pointer;">×</button>
  `;
  container.appendChild(row);
  refreshStartTimesUi();
};

function collectStartTimes() {
  const primary = (v('ns-start') || '').trim();
  if (!primary) return null;
  const extras = Array.from(document.querySelectorAll('.ns-extra-start'))
    .map(el => el.value.trim()).filter(Boolean);
  if (extras.length === 0) return null;
  return [primary, ...extras];
}

window.openSignupStartPicker = async function(shiftId) {
  const { data: shift } = await sb.from('c_shifts').select('*').eq('id', shiftId).single();
  if (!shift || !shift.start_times || shift.start_times.length === 0) {
    return signUpForShift(shiftId);
  }
  openModal(`Pick your start time · ${fmtDateShort(shift.bake_date)}`, `
    <p style="font-size:.92rem;color:var(--brown-dk);margin-bottom:14px;">This shift has multiple start times. Which works for you?</p>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${shift.start_times.map((t, i) => `
        <label style="display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--tan);border-radius:4px;cursor:pointer;background:var(--cream-lt);">
          <input type="radio" name="signup-start" value="${esc(t)}" ${i===0?'checked':''} />
          <strong style="font-size:1rem;">${esc(fmtTime(t))}</strong>
        </label>
      `).join('')}
    </div>
  `, [
    { label:'Cancel', cls:'btn-outline', onClick: closeModal },
    { label:'Sign up', cls:'btn-primary', onClick: async () => {
      const chosen = document.querySelector('input[name="signup-start"]:checked')?.value;
      try {
        await contractorSignUpForShift(shiftId, chosen);
        closeModal();
        toast('Signed up');
        refreshActiveSection();
      } catch (e) { toast(e.message || 'Sign-up failed', {error:true}); }
    }}
  ]);
};

window.adminPromoteShift = async function(shiftId) {
  if (!confirm('Promote this tentative shift to Open? Contractors will be notified.')) return;
  try {
    await sb.from('c_shifts').update({ status: 'open' }).eq('id', shiftId);
    const { data: shift } = await sb.from('c_shifts').select('*').eq('id', shiftId).single();
    const contractors = await loadAllContractors({ activeOnly:true });
    const others = contractors.filter(c => c.role !== 'admin');
    await notifyMany('shift_new', others, c => ({
      to_email:   c.email,
      first_name: c.first_name,
      bake_date:  fmtDate(shift.bake_date),
      start_time: fmtTime(shift.start_time),
      location:   shift.location,
      spots_total:String(shift.spots_total),
      shift_notes:shift.notes || '(none)',
      portal_url: PORTAL_URL
    }));
    toast('Shift promoted to open, contractors notified');
    refreshActiveSection();
  } catch (e) { toast(e.message || 'Failed', {error:true}); }
};



// ============================================================
// BULK: activate logins for all contractors that don't have one
// ============================================================
window.activateAllLogins = async function() {
  // Logins are kept in sync by a database trigger (migration 008); this just re-runs the sync for everyone.
  const { data, error } = await sb.rpc('c_sync_all_logins');
  if (error) { toast(error.message, {error:true}); return; }
  const missing = (data||[]).filter(r => !r.linked);
  toast(missing.length ? `Synced. ${missing.length} still without login (missing email or PIN): ${missing.map(m=>m.first_name).join(', ')}` : `All ${(data||[]).length} contractor logins are in sync with their email + PIN.`);
  refreshActiveSection();
};

</script>
