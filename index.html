<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<meta name="theme-color" content="#e60000" />
<!-- Security headers (GitHub Pages can't set HTTP response headers, so we use meta tags) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.emailjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.emailjs.com" />
<meta http-equiv="X-Content-Type-Options" content="nosniff" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>Contractor Portal – Lazar Family Bakehouse</title>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!--
  EmailJS SDK is included so future activation is one uncomment away.
  Until EmailJS credentials are wired in (see CONFIG block in the script), the
  notify() function below is a console-log no-op. Nothing is sent.
-->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ============================================================
   TOKENS
   Inherited from the LFB Wholesale Portal palette. Brand red
   accent; the CONTRACTOR PORTAL banner tells the two portals apart.
   ============================================================ */
:root {
  --cream:        #fdf6ee;
  --cream-dk:     #f3ebe0;
  --cream-lt:     #fef9f3;
  --tan:          #e4d8c8;
  --tan-dk:       #cfc0ab;
  --brown-lt:     #8b6914;
  --brown:        #3a2518;
  --brown-dk:     #2d1b0e;

  /* PRIMARY ACCENT: LFB brand red (same as the logo) */
  --accent:       #e60000;
  --accent-dk:    #b80000;
  --accent-lt:    #ff4d4d;

  --gold:         #8b6914;
  --gold-lt:      #a07b1a;
  --white:        #ffffff;
  --shadow:       rgba(58,37,24,.08);
  --danger:       #c0392b;
  --danger-dk:    #962d22;
  --muted:        #5c4a3a;
  --info:         #2e86c1;
  --info-bg:      #E8F4FD;
  --warn:         #d4ac0d;
  --warn-bg:      #FEF9E7;
  --success:      #1e8449;
  --success-bg:   #EAFAF1;
  --urgent:       #e74c3c;
  --urgent-bg:    #FDEDEC;
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { font-size:16px; }
body {
  font-family:'Nunito',sans-serif;
  background:var(--cream);
  color:var(--brown-dk);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}

/* ============================================================
   CONTRACTOR PORTAL TOP BANNER
   Solid brand-red bar, present on every screen incl. login.
   This is the at-a-glance differentiator from the (red-accented)
   wholesale portal.
   ============================================================ */
.portal-banner {
  background:var(--accent);
  color:var(--white);
  text-align:center;
  font-family:'Nunito',sans-serif;
  font-size:.72rem;
  font-weight:700;
  letter-spacing:.22em;
  text-transform:uppercase;
  padding:6px 8px;
  position:sticky;
  top:0;
  z-index:200;
  border-bottom:1px solid rgba(0,0,0,.08);
}

/* ============================================================
   LOGIN
   ============================================================ */
#login-screen {
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  background:var(--cream);
  padding:0 0 24px;
}
#login-screen .login-inner {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:100%;
  padding:32px 18px;
}
.login-logo { text-align:center; margin-bottom:28px; }
.login-logo .logo-img {
  width:260px; max-width:80vw; height:auto;
  display:block; margin:0 auto 4px;
}
.login-logo h1 {
  font-family:'Playfair Display',serif;
  font-size:1.7rem;
  color:var(--brown-dk);
  letter-spacing:.02em;
}
.login-logo p {
  color:var(--muted);
  font-size:.74rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  margin-top:6px;
}
.login-card {
  background:var(--white);
  border-radius:6px;
  padding:30px 24px;
  width:100%;
  max-width:400px;
  box-shadow:0 4px 24px rgba(59,35,20,.10);
  border-top:3px solid var(--accent);
}
.lf { display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
.lf label {
  font-size:.78rem; font-weight:700; text-transform:uppercase;
  letter-spacing:.08em; color:var(--brown);
}
.lf input, .lf select {
  padding:13px 14px;
  border:1px solid var(--tan);
  border-radius:4px;
  font-family:'Nunito',sans-serif;
  font-size:1rem;        /* 16px+ prevents iOS auto-zoom on focus */
  background:var(--cream);
  color:var(--brown-dk);
  transition:border-color .2s;
}
.lf input:focus, .lf select:focus { outline:none; border-color:var(--accent); }
.login-btn {
  width:100%;
  padding:14px;
  background:var(--accent);
  color:#fff; border:none; border-radius:4px;
  font-family:'Nunito',sans-serif;
  font-size:.95rem; font-weight:700; letter-spacing:.02em;
  cursor:pointer; transition:background .2s; margin-top:6px;
  min-height:48px;       /* iOS tap target */
}
.login-btn:hover { background:var(--accent-dk); }
.login-btn:disabled { opacity:.6; cursor:not-allowed; }
.login-error { color:var(--danger); font-size:.85rem; text-align:center; margin-top:12px; }
.login-error:empty { display:none; }
.login-hint { color:var(--muted); font-size:.78rem; text-align:center; margin-top:14px; }
.login-link {
  background:none; border:none; color:var(--accent);
  font-size:.78rem; cursor:pointer; text-decoration:underline;
  font-family:'Nunito',sans-serif; padding:6px 8px;
}

/* ============================================================
   APP SHELL
   ============================================================ */
#app { display:none; flex-direction:column; min-height:100vh; }
header {
  background:var(--white);
  color:var(--brown-dk);
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:2px solid var(--accent);
  gap:10px;
}
.hdr-text h1 {
  font-family:'Playfair Display',serif;
  font-size:1.15rem;
  color:var(--brown-dk);
  letter-spacing:.01em;
  line-height:1.15;
}
.hdr-logo { height:38px; width:auto; display:block; }
@media(max-width:639px){
  header { padding:8px 12px; }
  .hdr-text p { display:none; }
  .hdr-user span { display:none; }
  .portal-banner { padding:4px 8px; font-size:.64rem; }
  .page-h { font-size:1.3rem; }
  .panel { padding:14px; }
  .stat-card .sv { font-size:1.35rem; }
  .btn { min-height:44px; }
  .panel-actions .btn, .form-actions .btn { flex:1 1 auto; }
  .ct-doc { padding:14px; }
  .ct-sig { max-width:100%; }
  .modal { padding:16px 14px 20px; }
  td, th { padding:8px 8px; font-size:.84rem; }
}
.hdr-text p {
  font-size:.66rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  margin-top:2px;
}
.hdr-right { display:flex; align-items:center; gap:8px; }
.hdr-user { font-size:.74rem; color:var(--muted); text-align:right; line-height:1.2; }
.hdr-user strong { display:block; color:var(--brown-dk); font-weight:700; font-size:.82rem; }
.btn-logout {
  background:transparent;
  border:1px solid var(--tan);
  color:var(--brown);
  padding:8px 12px;
  border-radius:4px;
  cursor:pointer;
  font-family:'Nunito',sans-serif;
  font-size:.78rem;
  min-height:36px;
}
.btn-logout:hover { background:var(--cream-dk); color:var(--brown-dk); }

/* Phones: fixed bottom tab bar with the 4 most-used tabs + "More" */
nav {
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:var(--white);
  border-top:1px solid var(--tan);
  box-shadow:0 -2px 10px rgba(45,27,14,.08);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:4px 4px calc(4px + env(safe-area-inset-bottom));
}
nav button {
  background:none; border:none;
  color:var(--brown);
  font-family:'Nunito',sans-serif;
  font-size:.66rem; font-weight:600;
  padding:6px 2px 4px;
  cursor:pointer;
  border-top:3px solid transparent;
  transition:all .15s;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  min-height:52px;
}
nav button .ni { font-size:1.25rem; line-height:1.1; }
nav button.nav-secondary { display:none; }
nav button.active { color:var(--accent); border-top-color:var(--accent); font-weight:700; }
.more-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.more-grid button { background:var(--cream-lt); border:1px solid var(--tan); border-radius:8px; padding:14px 6px; font-family:'Nunito',sans-serif; font-size:.8rem; color:var(--brown-dk); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; min-height:72px; }
.more-grid button .ni { font-size:1.5rem; }
.more-grid button.active { border-color:var(--accent); color:var(--accent); font-weight:700; }
nav button:hover { color:var(--brown-dk); }

main { padding:14px 14px 96px; max-width:1100px; margin:0 auto; flex:1; width:100%; }
.section { display:none; }
.section.active { display:block; }

/* ============================================================
   TYPOGRAPHY
   ============================================================ */
.page-h {
  font-family:'Playfair Display',serif;
  font-size:1.5rem; font-weight:700;
  color:var(--brown-dk); margin-bottom:2px;
}
.page-sub {
  color:var(--muted);
  font-size:.74rem; font-weight:700;
  text-transform:uppercase; letter-spacing:.12em;
  margin-bottom:18px;
}

/* ============================================================
   PANELS
   ============================================================ */
.panel {
  background:var(--white);
  border:1px solid var(--tan);
  border-radius:4px;
  padding:18px;
  margin-bottom:18px;
}
.panel-title {
  font-family:'Playfair Display',serif;
  font-size:1.05rem; font-weight:600;
  color:var(--brown-dk);
  margin-bottom:12px; padding-bottom:9px;
  border-bottom:1px solid var(--tan);
}
.panel-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }

.stats-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:18px;
}
.stat-card {
  background:var(--white);
  border:1px solid var(--tan);
  border-radius:4px;
  padding:14px;
  border-top:3px solid var(--accent);
}
.stat-card .sl {
  font-size:.7rem; text-transform:uppercase;
  letter-spacing:.1em; color:var(--muted);
}
.stat-card .sv {
  font-family:'Playfair Display',serif;
  font-size:1.6rem; font-weight:700;
  color:var(--brown-dk); margin-top:4px;
  word-break:break-word;
}
.stat-card .sh {
  font-size:.72rem; color:var(--muted); margin-top:2px;
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display:inline-flex; align-items:center; justify-content:center;
  gap:6px;
  padding:11px 16px;
  border:none; border-radius:4px;
  font-family:'Nunito',sans-serif;
  font-size:.88rem; font-weight:600; letter-spacing:.01em;
  cursor:pointer; transition:all .15s;
  min-height:44px;
  text-decoration:none;
}
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:var(--accent-dk); }
.btn-gold { background:var(--gold); color:var(--white); }
.btn-gold:hover { background:var(--brown); }
.btn-outline { background:transparent; border:1px solid var(--tan); color:var(--brown); }
.btn-outline:hover { background:var(--cream-dk); }
.btn-danger { background:var(--danger); color:white; }
.btn-danger:hover { background:var(--danger-dk); }
.btn-sm { padding:6px 12px; font-size:.78rem; min-height:32px; }
.btn-block { width:100%; }
.btn[disabled] { opacity:.55; cursor:not-allowed; }

/* ============================================================
   FORMS
   ============================================================ */
.form-row {
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  margin-bottom:12px;
}
.fg { display:flex; flex-direction:column; gap:4px; }
.fg label {
  font-size:.76rem; font-weight:700; text-transform:uppercase;
  letter-spacing:.08em; color:var(--brown);
}
.fg input, .fg select, .fg textarea {
  padding:11px 12px;
  border:1px solid var(--tan);
  border-radius:4px;
  font-family:'Nunito',sans-serif;
  font-size:1rem;        /* 16px+ prevents iOS auto-zoom */
  background:var(--cream);
  color:var(--brown-dk);
  transition:border-color .2s, background .2s;
}
.fg input:focus, .fg select:focus, .fg textarea:focus {
  outline:none; border-color:var(--accent); background:var(--white);
}
.fg textarea { resize:vertical; min-height:80px; font-family:'Nunito',sans-serif; }
.fg input[readonly] { background:var(--cream-dk); color:var(--muted); cursor:not-allowed; }
.fg .help { font-size:.74rem; color:var(--muted); margin-top:2px; }
.form-actions { display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; }

/* ============================================================
   TABLES
   ============================================================ */
.tbl-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
table { width:100%; border-collapse:collapse; font-size:.86rem; }
thead { background:var(--brown-dk); color:var(--cream); }
thead th {
  padding:10px 12px; text-align:left;
  font-size:.72rem; letter-spacing:.08em; text-transform:uppercase;
  white-space:nowrap;
}
tbody tr { border-bottom:1px solid var(--tan); }
tbody tr:hover { background:var(--cream-dk); }
tbody td { padding:10px 12px; color:var(--brown-dk); vertical-align:top; }
.empty-row { text-align:center; color:var(--muted); font-style:italic; padding:22px !important; }

/* Card-list alternative to tables on mobile */
.card-list { display:flex; flex-direction:column; gap:10px; }
.card {
  background:var(--white);
  border:1px solid var(--tan);
  border-radius:4px;
  padding:14px;
  border-left:3px solid var(--accent);
}
.card-hd { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
.card-hd h3 { font-family:'Playfair Display',serif; font-size:1.02rem; color:var(--brown-dk); line-height:1.2; }
.card-sub { font-size:.78rem; color:var(--muted); margin-top:2px; }
.card-body { font-size:.88rem; color:var(--brown-dk); }
.card-meta { display:flex; gap:14px; flex-wrap:wrap; font-size:.78rem; color:var(--muted); margin-top:8px; }
.card-meta strong { color:var(--brown-dk); }
.card-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.card-actions .btn { flex:1; min-width:120px; }

/* ============================================================
   BADGES
   ============================================================ */
.badge {
  display:inline-block; padding:3px 9px; border-radius:3px;
  font-size:.72rem; font-weight:600; letter-spacing:.02em;
  white-space:nowrap;
}
.b-active     { background:#d4edda; color:#155724; }
.b-pending    { background:#fff3cd; color:#856404; }
.b-approved   { background:#d4edda; color:#155724; }
.b-paid       { background:#cce5ff; color:#004085; }
.b-released   { background:var(--tan); color:var(--brown); }
.b-cancelled  { background:#f8d7da; color:#721c24; }
.b-completed  { background:#d1ecf1; color:#0c5460; }
.b-inactive   { background:var(--tan); color:var(--brown); }
.b-warn       { background:#fff3cd; color:#856404; }
.b-danger     { background:#f8d7da; color:#721c24; }

/* ============================================================
   MODALS
   ============================================================ */
.modal-overlay {
  display:none;
  position:fixed; inset:0;
  background:rgba(0,0,0,.55);
  z-index:1000;
  align-items:flex-end;        /* slide-up sheet on mobile */
  justify-content:center;
  padding:0;
}
.modal-overlay.open { display:flex; }
.modal {
  background:var(--white);
  border-radius:8px 8px 0 0;
  padding:20px 18px 24px;
  width:100%;
  max-width:640px;
  max-height:94vh;
  overflow-y:auto;
  box-shadow:0 -4px 24px rgba(20,20,19,.18);
}
.modal-title {
  font-family:'Playfair Display',serif;
  font-size:1.15rem;
  margin-bottom:14px;
  color:var(--brown-dk);
}
.modal-actions {
  display:flex; gap:10px;
  margin-top:18px;
  flex-direction:column;
}
.modal-actions .btn { width:100%; }

/* ============================================================
   CONTRACTS / E-SIGNATURE
   ============================================================ */
.modal.modal-wide { max-width:900px; }
.ct-wrap { font-size:.9rem; line-height:1.55; color:var(--brown-dk); }
.ct-doc { background:var(--white); border:1px solid var(--tan); border-radius:6px; padding:22px 24px; }
.ct-h1 { font-family:'Playfair Display',serif; font-size:1.05rem; text-align:center; margin:4px 0; letter-spacing:.04em; }
.ct-h2 { font-size:.9rem; font-weight:700; margin:18px 0 4px; text-transform:uppercase; letter-spacing:.03em; }
.ct-p { margin:0 0 10px; text-align:justify; }
.ct-sig { margin:16px 0 4px; padding:10px 0 0; border-top:1px solid var(--tan-dk); max-width:380px; }
.ct-sig-name { font-family:'Playfair Display',serif; font-style:italic; font-size:1.3rem; color:var(--brown-dk); }
.ct-sig-meta { font-size:.72rem; color:var(--muted); margin-top:2px; }
.ct-sig-pending { border-top:1px dashed var(--tan-dk); }
.ct-signbox { margin-top:16px; padding:16px; border:2px solid var(--accent); border-radius:8px; background:var(--success-bg); transition:opacity .2s; }
.ct-signbox.locked { opacity:.45; pointer-events:none; }
.ct-signbox.locked::before { content:'Scroll to the end of the agreement to unlock signing'; display:block; font-size:.8rem; font-weight:700; color:var(--brown); margin-bottom:8px; }
.ct-consent { display:flex; gap:10px; align-items:flex-start; font-size:.82rem; line-height:1.45; cursor:pointer; }
.ct-consent input { margin-top:3px; flex-shrink:0; width:18px; height:18px; }

/* ============================================================
   TOAST
   ============================================================ */
#toast {
  position:fixed; bottom:20px; left:50%; transform:translate(-50%, 80px);
  background:var(--brown-dk);
  color:var(--cream);
  padding:12px 20px;
  border-radius:6px;
  font-size:.9rem;
  box-shadow:0 4px 16px rgba(20,20,19,.20);
  opacity:0; transition:all .25s;
  z-index:9999;
  border-left:3px solid var(--accent);
  max-width:90%;
  text-align:center;
}
#toast.show { transform:translate(-50%, 0); opacity:1; }
#toast.error { border-left-color:var(--danger); }

/* ============================================================
   NOTIFICATION BANNERS (info / warning / urgent)
   ============================================================ */
.notif-item {
  padding:10px 16px;
  display:flex; align-items:center; gap:10px;
  font-size:.86rem;
  border-bottom:1px solid rgba(0,0,0,.07);
}
.notif-info    { background:var(--info-bg);    color:#1a5276; border-left:4px solid var(--info); }
.notif-warning { background:var(--warn-bg);    color:#7d6608; border-left:4px solid var(--warn); }
.notif-urgent  { background:var(--urgent-bg);  color:#922b21; border-left:4px solid var(--urgent); }
.notif-success { background:var(--success-bg); color:#1e8449; border-left:4px solid var(--success); }
.notif-text { flex:1; }
.notif-dismiss { background:none; border:none; cursor:pointer; opacity:.5; font-size:1.1rem; padding:2px 8px; }
.notif-dismiss:hover { opacity:1; }

/* ============================================================
   AVAILABILITY CALENDAR
   ============================================================ */
.cal-wrap { background:var(--white); border:1px solid var(--tan); border-radius:4px; padding:14px; margin-bottom:18px; }
.cal-header {
  display:flex; align-items:center; justify-content:space-between;
  gap:8px; margin-bottom:10px;
}
.cal-month-label {
  font-family:'Playfair Display',serif;
  font-size:1.1rem; color:var(--brown-dk);
  flex:1; text-align:center;
}
.cal-nav-btn {
  background:var(--cream-dk); border:none; color:var(--brown-dk);
  font-size:1.1rem; width:36px; height:36px; border-radius:4px;
  cursor:pointer; font-weight:700;
}
.cal-nav-btn:hover { background:var(--tan); }
.cal-dow-row {
  display:grid; grid-template-columns:repeat(7,1fr); gap:2px;
  font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;
  text-align:center; padding-bottom:4px; font-weight:700;
}
.cal-grid {
  display:grid; grid-template-columns:repeat(7,1fr); gap:3px;
}
.cal-day {
  aspect-ratio:1;
  background:var(--cream-lt);
  border:1px solid var(--tan);
  border-radius:4px;
  display:flex; flex-direction:column;
  align-items:flex-start; justify-content:flex-start;
  padding:4px 5px;
  cursor:pointer;
  position:relative;

<script>
/* ============================================================
   CONFIG
   ============================================================ */
// SUPABASE, same project as the wholesale portal (anon key is

const SUPABASE_URL  = 'https://ylvoswzsijigyezqvaat.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsdm9zd3pzaWppZ3llenF2YWF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2Mjk5MTAsImV4cCI6MjA4OTIwNTkxMH0.iA4QMZkxTsqArV3CgHb-YluiBeiIq5RppGV6kBe8G8g';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ─── EmailJS, PLACEHOLDERS ────────────────────────────────────
// When the second EmailJS account is created (see docs/EMAILJS.md),
// paste the credentials here and set EMAILJS_ENABLED to true.
// Until then, notify() is a no-op (console-logs the intent).
const EMAILJS_ENABLED = false;
const EMAILJS_PUBLIC_KEY = 'PLACEHOLDER_PUBLIC_KEY';
const EMAILJS_SERVICE_ID = 'PLACEHOLDER_SERVICE_ID';
const EMAILJS_TEMPLATES = {
  shift_new:         'PLACEHOLDER_TEMPLATE_shift_new',
  signup_confirm:    'PLACEHOLDER_TEMPLATE_signup_confirm',
  shift_released:    'PLACEHOLDER_TEMPLATE_shift_released',
  hours_submitted:   'PLACEHOLDER_TEMPLATE_hours_submitted',
  hours_approved:    'PLACEHOLDER_TEMPLATE_hours_approved',
  shift_reminder:    'PLACEHOLDER_TEMPLATE_shift_reminder',
  shift_cancelled:   'PLACEHOLDER_TEMPLATE_shift_cancelled',
  availability_nudge:'PLACEHOLDER_TEMPLATE_availability_nudge',
  contract_sent:     'PLACEHOLDER_TEMPLATE_contract_sent',
  contract_signed:   'PLACEHOLDER_TEMPLATE_contract_signed',
  contract_declined: 'PLACEHOLDER_TEMPLATE_contract_declined'
};
const ADMIN_EMAIL = 'info@lazarfamilybakehouse.com'; // recipient for admin-facing emails
const USERNAME_DOMAIN = 'contractors.lazarfamilybakehouse.com'; // "jake" at the login signs in as jake@<this>
const PORTAL_URL  = (typeof window !== 'undefined' && window.location.origin.startsWith('http'))
  ? window.location.origin
  : 'https://contractors.lazarfamilybakehouse.com';

// Activate EmailJS only if enabled
if (EMAILJS_ENABLED && window.emailjs) {
  try { emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY }); }
  catch (e) { console.warn('EmailJS init failed', e); }
}

/* ============================================================
   GLOBAL STATE
   ============================================================ */
let session = null;       // { user, contractor, role: 'admin'|'contractor' }
let _inactivityTimer = null;
const INACTIVITY_TIMEOUT_MS = 60 * 60 * 1000;  // 60 minutes
const STORAGE_KEYS = {
  dismissedNotifs: 'lfb_c_dismissed_notifs'
};

/* ============================================================
   NOTIFY, single email/notification entry point.
   Sends through the `contractor-notify` Supabase Edge Function
   (Resend, same sender as the partner portal). The function checks
   the caller's login and decides recipients server-side; the
   client only suggests `to_email`. Set EMAIL_ENABLED=false to
   fall back to console logging.
   ============================================================ */
const EMAIL_ENABLED = true;
function notify(eventType, payload) {
  if (!EMAIL_ENABLED || !session) {
    console.log('[notify:stub]', eventType, payload);
    return Promise.resolve({ stubbed: true });
  }
  return sb.functions.invoke('contractor-notify', { body: { event: eventType, ...payload } })
    .then(r => { if (r.error) { console.warn('[notify] failed', eventType, r.error); return null; } return r.data; })
    .catch(err => { console.warn('[notify] send failed', eventType, err); return null; });
}

// Helper to broadcast (sequentially, with a small delay to be nice
// to free-tier email rate limits).
async function notifyMany(eventType, recipients, paramsFn) {
  for (const r of recipients) {
    const params = paramsFn(r);
    await notify(eventType, params);
    await sleep(450);
  }
}

/* ============================================================
   HELPERS
   ============================================================ */
function $(id){ return document.getElementById(id); }
function v(id){ const el=$(id); return el ? el.value.trim() : ''; }
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtCur(n){ return '$'+(Number(n)||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function fmtDate(d){
  if (!d) return '-';
  const [y,m,day] = String(d).split('T')[0].split('-');
  return new Date(+y,+m-1,+day).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtDateShort(d){
  if (!d) return '-';
  const [y,m,day] = String(d).split('T')[0].split('-');
  return new Date(+y,+m-1,+day).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function fmtDay(d){
  if (!d) return '';
  const [y,m,day] = String(d).split('T')[0].split('-');
  return new Date(+y,+m-1,+day).toLocaleDateString('en-US',{weekday:'long'});
}
function fmtTime(t){
  if (!t) return '-';
  const [h,m] = String(t).split(':');
  const d = new Date();
  d.setHours(+h, +m||0, 0, 0);
  return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function isoFromDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function daysFromToday(iso){
  const a=new Date(todayISO()+'T12:00:00');
  const b=new Date(iso+'T12:00:00');
  return Math.round((b-a)/(1000*60*60*24));
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function toast(msg, opts={}){
  const t = $('toast');
  t.textContent = msg;
  t.className = opts.error ? 'show error' : 'show';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.className='', 2800);
}

function openModal(title, bodyHtml, actions){
  $('generic-modal-title').textContent = title;
  $('generic-modal-body').innerHTML = bodyHtml;
  const ab = $('generic-modal-actions');
  ab.innerHTML = '';
  (actions||[]).forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn '+(a.cls||'btn-outline');
    b.textContent = a.label;
    b.onclick = a.onClick || (()=>closeModal());
    if (a.disabled) b.disabled = true;
    ab.appendChild(b);
  });
  $('generic-modal').classList.add('open');
}
function closeModal(){ $('generic-modal').classList.remove('open'); $('generic-modal').querySelector('.modal').classList.remove('modal-wide'); }

function resetInactivityTimer(){
  clearTimeout(_inactivityTimer);
  _inactivityTimer = setTimeout(()=>{
    toast('Signed out, inactivity timeout', {error:true});
    signOut();
  }, INACTIVITY_TIMEOUT_MS);
}
['click','keydown','touchstart'].forEach(ev =>
  document.addEventListener(ev, ()=>{ if (session) resetInactivityTimer(); }, {passive:true})
);

/* ============================================================
   AUTH
   ============================================================ */
const ADMIN_LOGIN_EMAIL = 'info@lazarfamilybakehouse.com';

function toggleAdminLogin() {
  const mode = document.body.dataset.loginMode === 'admin' ? 'contractor' : 'admin';
  document.body.dataset.loginMode = mode;
  const emailField = $('login-email-field');
  const pwLabel    = $('login-password-label');
  const pwInput    = $('login-password');
  const subtitle   = $('login-mode-subtitle');
  const firstTime  = $('login-first-time');
  const hintArea   = $('login-hint-area');
  const adminBtn   = $('admin-toggle-btn');
  if (mode === 'admin') {
    emailField.style.display = 'none';
    pwLabel.textContent = 'Admin PIN';
    pwInput.placeholder = 'Admin PIN';
    subtitle.textContent = 'Admin Login';
    firstTime.style.display = 'none';
    hintArea.innerHTML = '<button class="login-link" onclick="toggleAdminLogin()">&larr; Back to contractor login</button>';
    adminBtn.style.opacity = '.85';
    pwInput.focus();
  } else {
    emailField.style.display = '';
    pwLabel.textContent = 'PIN';
    pwInput.placeholder = '6-digit PIN from admin';
    subtitle.textContent = 'Contractor Portal';
    firstTime.style.display = '';
    hintArea.innerHTML = '<span style="color:var(--muted);">Forgot your PIN? Ask admin to reset it.</span>';
    adminBtn.style.opacity = '.45';
  }
  $('login-error').textContent = '';
}

async function signIn() {
  const btn = $('login-submit');
  const err = $('login-error');
  err.textContent = '';
  const isAdmin = document.body.dataset.loginMode === 'admin';
  let email = isAdmin ? ADMIN_LOGIN_EMAIL : v('login-email').toLowerCase().replace(/\s+/g,'');
  if (!isAdmin && email && !email.includes('@')) email = email + '@' + USERNAME_DOMAIN;  // short usernames map to an internal address
  const password = isAdmin ? v('login-password') : v('login-password').replace(/\s+/g,'');
  if (!email || !password) {
    err.textContent = isAdmin ? 'Enter the admin PIN.' : 'Email (or username) and PIN are required.';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      console.warn('signIn', error);
      const m = String(error.message||'').toLowerCase();
      if (m.includes('invalid login')) throw new Error(isAdmin ? 'Incorrect admin password.' : 'Email or PIN is wrong. PINs are the 6 digits your admin gave you; the email must match the one on file.');
      if (m.includes('rate') || error.status === 429) throw new Error('Too many attempts. Wait a minute and try again.');
      if (m.includes('fetch') || m.includes('network')) throw new Error('No connection. Check your internet and try again.');
      throw new Error('Sign in failed: ' + (error.message || 'unknown error'));
    }

    const { data: me, error: meErr } = await sb.rpc('c_me');
    if (meErr) throw meErr;
    if (!me || !me.id) throw new Error('No profile linked to this account. Contact admin.');
    if (me.status !== 'active') throw new Error('Your account is not active. Contact admin.');

    session = { user: data.user, contractor: me, role: me.role };
    await bootApp();
    resetInactivityTimer();
  } catch (e) {
    console.warn('Sign in error', e);
    err.textContent = e.message || 'Sign in failed. Try again.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

async function signOut() {
  clearTimeout(_inactivityTimer);
  try { await sb.auth.signOut(); } catch (e) { /* swallow */ }
  sb.removeAllChannels();
  session = null;
  $('app').style.display = 'none';
  $('login-screen').style.display = 'flex';
  $('login-password').value = '';
  $('login-error').textContent = '';
  if (document.body.dataset.loginMode === 'admin') toggleAdminLogin();
}

async function sendResetEmail() {
  const email = v('login-email').toLowerCase();
  if (!email) { toast('Enter your email above first', {error:true}); return; }
  try {
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: PORTAL_URL
    });
    if (error) throw error;
    toast('Check your email for a reset link');
  } catch (e) {
    toast(e.message || 'Could not send reset email', {error:true});
  }
}

// Restore session on page load (if user is already signed in)
async function tryRestoreSession() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return;
  try {
    const { data: me, error: meErr } = await sb.rpc('c_me');
    if (meErr || !me || !me.id) return;
    if (me.status !== 'active') return;
    session = { user: data.session.user, contractor: me, role: me.role };
    await bootApp();
    resetInactivityTimer();
  } catch (e) {
    console.warn('Restore session failed', e);
  }
}

/* ============================================================
   BOOT
   ============================================================ */
async function bootApp() {
  $('login-screen').style.display = 'none';
  $('app').style.display = 'flex';
  const c = session.contractor;
  $('hdr-user-name').textContent = `${c.first_name||''} ${c.last_name||''}`.trim() || c.email;
  $('hdr-user-role').textContent = session.role === 'admin' ? 'Admin' : 'Contractor';
  $('hdr-subtitle').textContent = session.role === 'admin' ? 'Admin Dashboard' : 'Contractor Portal';
  buildNav();
  buildContent();
  const firstSection = session.role === 'admin' ? 'a-dashboard' : 'c-home';
  showSection(firstSection);
  setupRealtime();

function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  const sec = $('sec-'+id);
  if (sec) sec.classList.add('active');
  const navBtn = document.querySelector(`nav button[data-section="${id}"]`);
  const moreBtn = document.querySelector('nav button.nav-more');
  if (moreBtn) moreBtn.classList.toggle('active', !navIsPrimary(id));
  if (navBtn) {
    navBtn.classList.add('active');
    // Scroll active nav button into view on mobile
    navBtn.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
  }
  // Lazy-render the section the first time it's shown
  const renderer = SECTION_RENDERERS[id];
  if (renderer) renderer();
  window.scrollTo({ top:0, behavior:'instant' });
}

function setupRealtime() {
  // Subscribe to changes that may affect the current view. Cheap
  // and effective: any change to shifts, signups, hours, or payments
  // triggers a refresh of the currently visible section.
  const ch = sb.channel('c-realtime-'+Math.random().toString(36).slice(2,8))
    .on('postgres_changes', { event:'*', schema:'public', table:'c_shifts' }, refreshActiveSection)
    .on('postgres_changes', { event:'*', schema:'public', table:'c_shift_signups' }, refreshActiveSection)
    .on('postgres_changes', { event:'*', schema:'public', table:'c_hour_submissions' }, refreshActiveSection)
    .on('postgres_changes', { event:'*', schema:'public', table:'c_payments' }, refreshActiveSection)
    .on('postgres_changes', { event:'*', schema:'public', table:'c_availability' }, refreshActiveSection)
    .subscribe();
}
function refreshActiveSection() {
  const active = document.querySelector('.section.active');
  if (!active) return;
  const id = active.id.replace(/^sec-/,'');
  const r = SECTION_RENDERERS[id];
  if (r) r();
}

/* ============================================================
   NOTIFICATION BANNER
   In-portal banners (above the nav) for time-sensitive items
   like document expirations, stale availability, etc.
   ============================================================ */
function getDismissed() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEYS.dismissedNotifs)||'[]'); }
  catch { return []; }
}
function dismissNotif(key) {
  const dismissed = getDismissed();
  if (!dismissed.includes(key)) dismissed.push(key);
  localStorage.setItem(STORAGE_KEYS.dismissedNotifs, JSON.stringify(dismissed));
  renderNotifBanner();
}

async function renderNotifBanner() {
  const items = [];
  const c = session.contractor;
  const dismissed = getDismissed();

  // Food-handler-card expiration warning (contractor self)
  if (c.food_handler_card_expires) {
    const days = daysFromToday(c.food_handler_card_expires);
    if (days < 0)        items.push({ key:'food-exp', type:'urgent',  text:`Your food handler card expired ${Math.abs(days)} day${Math.abs(days)===1?'':'s'} ago. Please renew.` });
    else if (days <= 30) items.push({ key:'food-exp', type:'warning', text:`Your food handler card expires in ${days} day${days===1?'':'s'}.` });
  }

  // Unsigned agreement waiting (contractor), not dismissable
  if (session.role === 'contractor') {
    try {
      const { data: open } = await sb.from('c_contracts').select('id,title').in('status',['sent','viewed']).eq('contractor_id', c.id);
      (open||[]).forEach(k => items.push({ key:'contract-'+k.id, type:'urgent', sticky:true,
        text:`Action needed: please review and sign your ${k.title}.`, action:{ label:'Open', section:'c-contracts' } }));
    } catch (e) { /* table not migrated yet */ }
  }

  // Stale availability (contractor)
  if (session.role === 'contractor') {
    const last = c.availability_last_updated_at;
    const stale = !last || (Date.now() - new Date(last).getTime() > 30*24*60*60*1000);
    if (stale) items.push({ key:'avail-stale', type:'info', text:`Your availability looks out of date. Update it so we can plan shifts around you.` });
  }

  const html = items
    .filter(i => i.sticky || !dismissed.includes(i.key))
    .map(i => `
      <div class="notif-item notif-${i.type}">
        <span class="notif-text">${esc(i.text)}</span>
        ${i.action ? `<button class="btn btn-primary btn-sm" style="margin-left:8px;" onclick="showSection('${i.action.section}')">${esc(i.action.label)}</button>` : ''}
        ${i.sticky ? '' : `<button class="notif-dismiss" onclick="dismissNotif('${i.key}')">×</button>`}
      </div>
    `).join('');
  $('notif-banner').innerHTML = html;
}

async function loadShiftsWithCounts({ from, to, statuses } = {}) {
  let q = sb.from('c_shifts').select('*').order('bake_date', { ascending: true }).order('start_time', { ascending: true });
  if (from) q = q.gte('bake_date', from);
  if (to)   q = q.lte('bake_date', to);
  if (statuses) q = q.in('status', statuses);
  const { data: shifts, error } = await q;
  if (error) { toast(error.message,{error:true}); return []; }
  if (!shifts?.length) return [];
  const ids = shifts.map(s=>s.id);
  const { data: signups, error: sErr } = await sb.from('c_shift_signups')
    .select('id, shift_id, contractor_id, status, signed_up_at, released_at')
    .in('shift_id', ids);
  if (sErr) { console.warn(sErr); }
  const byShift = {};
  (signups||[]).forEach(su => {
    (byShift[su.shift_id] ||= []).push(su);
  });
  shifts.forEach(s => {
    const arr = byShift[s.id] || [];
    s.signups        = arr;
    s.active_signups = arr.filter(x => x.status === 'signed_up');
    s.spots_filled   = s.active_signups.length;
    s.spots_left     = Math.max(0, s.spots_total - s.spots_filled);
    s.i_signed_up    = arr.some(x => x.contractor_id === session.contractor.id && x.status === 'signed_up');
    s.my_signup      = arr.find(x => x.contractor_id === session.contractor.id);
  });
  return shifts;
}

// { contractor_id: { hours, n } } for approved hour rows with no payment item yet
async function loadUnpaidHoursByContractor() {
  const { data: subs, error } = await sb.from('c_hour_submissions')
    .select('id, contractor_id, approved_hours')
    .eq('status', 'approved');
  if (error || !subs?.length) return {};
  const paid = new Set();
  for (let i = 0; i < subs.length; i += 500) {
    const { data } = await sb.from('c_payment_items').select('hour_submission_id').in('hour_submission_id', subs.slice(i, i+500).map(x => x.id));
    (data||[]).forEach(x => paid.add(x.hour_submission_id));
  }
  const out = {};
  subs.filter(x => !paid.has(x.id)).forEach(x => {
    out[x.contractor_id] = out[x.contractor_id] || { hours: 0, n: 0 };
    out[x.contractor_id].hours += Number(x.approved_hours||0); out[x.contractor_id].n++;
  });
  return out;
}

async function loadUnpaidApprovedHours(contractorId) {
  // Approved hour rows for this contractor that don't yet have a payment_item
  const { data: subs, error } = await sb.from('c_hour_submissions')
    .select('*, shift:c_shifts(*)')
    .eq('contractor_id', contractorId)
    .eq('status', 'approved')
    .order('approved_at', { ascending: true });
  if (error) { toast(error.message,{error:true}); return []; }
  if (!subs?.length) return [];
  const ids = subs.map(s=>s.id);
  const { data: paid } = await sb.from('c_payment_items')
    .select('hour_submission_id')
    .in('hour_submission_id', ids);
  const paidIds = new Set((paid||[]).map(p=>p.hour_submission_id));
  return subs.filter(s => !paidIds.has(s.id));
}

  const { data: can, error: canErr } = await sb.rpc('c_can_invite', { p_email: email });
  if (canErr) throw canErr;
  if (!can) throw new Error('No active contractor found with that email');
  const { error } = await sb.auth.signInWithOtp({

    options: { shouldCreateUser: true, emailRedirectTo: PORTAL_URL }

async function adminCreateShift(shift) {
  const status = ['open','tentative','cancelled','completed'].includes(shift.status) ? shift.status : 'open';
  const payload = {
    bake_date:   shift.bake_date,
    start_time:  shift.start_time,
    end_time:    shift.end_time || null,
    location:    shift.location,
    spots_total: Number(shift.spots_total) || 1,
    notes:       shift.notes || '',
    created_by:  session.contractor.id,
    status:      status,
    start_times: shift.start_times || null
  };
  const { data, error } = await sb.from('c_shifts').insert(payload).select().single();
  if (error) throw error;
  if (status !== 'open') return data;
  const contractors = await loadAllContractors({ activeOnly:true });
  const others = contractors.filter(c => c.role !== 'admin');
  await notifyMany('shift_new', others, c => ({
    to_email:   c.email,
    first_name: c.first_name,
    bake_date:  fmtDate(data.bake_date),
    start_time: fmtTime(data.start_time),
    location:   data.location,
    spots_total:String(data.spots_total),
    shift_notes:data.notes || '(none)',
    portal_url: PORTAL_URL
  }));
  return data;
}

  if (error) throw error;
}

async function adminCancelShift(id, reason) {
  // Look up signups so we can notify
  const { data: shift } = await sb.from('c_shifts').select('*').eq('id', id).single();
  const { data: signups } = await sb.from('c_shift_signups')
    .select('contractor:c_contractors!contractor_id(email, first_name)')
    .eq('shift_id', id).eq('status', 'signed_up');
  const { error } = await sb.from('c_shifts').update({
    status: 'cancelled',
    cancelled_reason: reason || '',
    cancelled_at: new Date().toISOString()
  }).eq('id', id);
  if (error) throw error;
  await notifyMany('shift_cancelled', (signups||[]).map(s=>s.contractor), c => ({
    to_email:           c.email,
    first_name:         c.first_name,
    bake_date:          fmtDate(shift.bake_date),
    location:           shift.location,
    cancel_reason_line: reason ? `Reason: ${reason}` : '',

async function contractorReleaseSignup(signupId) {

  const { data: signup } = await sb.from('c_shift_signups')
    .select('*, shift:c_shifts(*)').eq('id', signupId).single();
  const { error } = await sb.rpc('c_release_signup', { p_signup_id: signupId });

      to_email:   c.email,
      first_name: c.first_name,

      start_time: fmtTime(signup.shift.start_time),
      location:   signup.shift.location,
      portal_url: PORTAL_URL
    }));

async function adminCreatePayment({ contractor_id, amount, method, paid_on, reference, notes, submissionIds }) {
  const { data: payment, error } = await sb.from('c_payments').insert({
    contractor_id, amount: Number(amount), method,
    paid_on, reference: reference||'', notes: notes||'',
    created_by: session.contractor.id
  }).select().single();
  if (error) throw error;
  if (submissionIds?.length) {
    // Look up amounts per submission for proper allocation
    const { data: subs } = await sb.from('c_hour_submissions')
      .select('id, approved_amount')
      .in('id', submissionIds);
    const items = (subs||[]).map(s => ({
      payment_id: payment.id,

      amount: s.approved_amount
    }));
    if (items.length) {
      const { error: iErr } = await sb.from('c_payment_items').insert(items);
      if (iErr) throw iErr;
    }

}

async function contractorSetAvailability(dates, status, note) {

      .delete()
      .eq('contractor_id', session.contractor.id)
      .in('the_date', dates);
    if (error) throw error;
    return dates.length;
  }
  const { data, error } = await sb.rpc('c_set_availability_bulk', {
    p_dates: dates, p_status: status, p_note: note || ''
  });
  if (error) throw error;
  return data;

async function uploadDocument({ file, document_type, expires_on }) {
  if (!file) throw new Error('No file selected');
  if (file.size > 10 * 1024 * 1024) throw new Error('File too large (10 MB max)');
  const safeName = file.name.replace(/[^\w.\-]/g,'_');
  const path = `${session.contractor.id}/${Date.now()}-${safeName}`;
  const { error: upErr } = await sb.storage.from('contractor-documents').upload(path, file, { upsert: false });
  if (upErr) throw upErr;
  const { error: insErr } = await sb.from('c_documents').insert({
    contractor_id: session.contractor.id,
    document_type, file_path: path, file_name: file.name,
    file_size_bytes: file.size, mime_type: file.type || null,
    expires_on: expires_on || null,
    uploaded_by: session.contractor.id
  });
  if (insErr) throw insErr;
}

async function deleteDocument(doc) {
  await sb.storage.from('contractor-documents').remove([doc.file_path]);
  const { error } = await sb.from('c_documents').delete().eq('id', doc.id);
  if (error) throw error;
}

async function downloadDocumentURL(filePath) {
  const { data, error } = await sb.storage.from('contractor-documents').createSignedUrl(filePath, 600);
  if (error) throw error;
  return data.signedUrl;
}

// ============================================================
function monthInfo(year, month0) {
  const first = new Date(year, month0, 1);
  const days = new Date(year, month0+1, 0).getDate();
  const blanks = first.getDay();  // 0=Sun
  const cells = [];
  for (let i = 0; i < blanks; i++) cells.push({ blank: true });
  for (let d = 1; d <= days; d++) cells.push({ blank: false, iso: isoFromDate(new Date(year, month0, d)), day: d });
  while (cells.length % 7 !== 0) cells.push({ blank: true });
  return { cells, monthLabel: first.toLocaleDateString('en-US',{month:'long',year:'numeric'}) };
}

let _clockTimer = null;

function fmtClockTime(ts) {
  if (!ts) return '-';
  return new Date(ts).toLocaleTimeString('en-US', { timeZone:'America/Denver', hour:'numeric', minute:'2-digit' });
}
function fmtElapsed(ms) {
  const s = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function teStatusBadge(t) {
  const map = { open:['b-open','On the clock'], submitted:['b-pending','Awaiting approval'], approved:['b-approved','Approved'], rejected:['b-rejected','Not approved'] };
  const [cls, label] = map[t.status] || ['', t.status];
  return `<span class="badge ${cls}">${label}</span>`;
}
function teHoursLabel(t) {
  if (t.status === 'approved') return `${Number(t.approved_hours).toFixed(2)} hrs`;
  if (t.worked_hours != null) return `${Number(t.worked_hours).toFixed(2)} hrs`;
  return '';
}

async function loadMyTimeEntries(limit = 6) {
  const { data, error } = await sb.from('c_time_entries')
    .select('*, shift:c_shifts(bake_date, location, start_time)')
    .eq('contractor_id', session.contractor.id)
    .order('clock_in', { ascending: false })
    .limit(limit);
  if (error) { toast(error.message, {error:true}); return []; }
  return data || [];
}

    body = `

          <div class="clock-time" id="clock-elapsed">${fmtElapsed(Date.now() - since)}</div>

function getPositionQuick() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    let done = false;
    const finish = (p) => { if (!done) { done = true; resolve(p); } };
    navigator.geolocation.getCurrentPosition(
      pos => finish({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => finish(null), { timeout: 4000, maximumAge: 300000 });
    setTimeout(() => finish(null), 4500);
  });
}

window.clockIn = async function() {
  const btn = $('clock-in-btn'); if (btn) { btn.disabled = true; btn.textContent = 'Clocking in...'; }
  try {
    const pos = await getPositionQuick();

    if (error) throw error;
    toast('Clocked in. Have a good bake!');
    refreshActiveSection();
  } catch (e) {
    toast(e.message || 'Could not clock in', {error:true});

};

function shiftCardHtml(s, contractorView) {
  const urgent =(contractorView && s.spots_left > 0 && daysFromToday(s.bake_date) <= 2 && s.status === 'open');
  const fillBar = `${s.spots_filled}/${s.spots_total} signed up`;
  const isTentative = s.status === 'tentative';
  const startTimesDisplay = (s.start_times && s.start_times.length > 0)
    ? s.start_times.map(t => fmtTime(t)).join(' / ')
    : fmtTime(s.start_time) + (s.end_time ? '–' + fmtTime(s.end_time) : '');
  let action;
  if (contractorView) {
    if (isTentative) {
      action = `<button class="btn btn-outline btn-sm" disabled>Tentative, locked</button>`;
    } else if (s.i_signed_up) {
      action = `<button class="btn btn-outline btn-sm" disabled>Signed up</button>`;
    } else if (s.spots_left > 0) {
      const hasMultiStarts = s.start_times && s.start_times.length > 0;
      action = hasMultiStarts
        ? `<button class="btn btn-primary btn-sm" onclick="openSignupStartPicker('${s.id}')">Sign up</button>`
        : `<button class="btn btn-primary btn-sm" onclick="signUpForShift('${s.id}')">Sign up</button>`;
    } else {
      action = `<button class="btn btn-outline btn-sm" disabled>Full</button>`;
    }
  } else {
    action = `<button class="btn btn-outline btn-sm" onclick="adminOpenShiftDetail('${s.id}')">View / edit</button>`;
    if (isTentative) {
      action = `<button class="btn btn-gold btn-sm" onclick="adminPromoteShift('${s.id}')">Promote to Open</button> ` + action;
    }
  }
  return `
    <div class="card" ${isTentative ? 'style="opacity:.85;border-left-color:var(--warn);"' : ''}>
      <div class="card-hd">
        <div>
          <h3>${esc(fmtDateShort(s.bake_date))} · ${esc(startTimesDisplay)}</h3>
          <div class="card-sub">📍 ${esc(s.location)}</div>
        </div>
        ${isTentative ? `<span class="badge b-warn">TENTATIVE</span>` : ''}
        ${urgent ? `<span class="badge b-danger">URGENT · ${daysFromToday(s.bake_date)===0?'TODAY':daysFromToday(s.bake_date)+' day'+(daysFromToday(s.bake_date)===1?'':'s')}</span>` : ''}
        ${s.status === 'cancelled' ? `<span class="badge b-cancelled">Cancelled</span>` : ''}
      </div>
      ${s.notes ? `<div class="card-body" style="font-size:.84rem;">${esc(s.notes)}</div>` : ''}
      <div class="card-meta">
        <span><strong>${fillBar}</strong></span>
        ${s.spots_left > 0 ? `<span style="color:var(--accent-dk);">${s.spots_left} open</span>` : `<span style="color:var(--muted);">Full</span>`}
      </div>
      <div class="card-actions">${action}</div>
    </div>
  `;
}

function renderAvailabilityGrid() {
  const info = monthInfo(_avState.year, _avState.month);
  $('av-month-label').textContent = info.monthLabel;
  const grid = $('av-grid');
  const today = todayISO();
  grid.innerHTML = info.cells.map(c => {
    if (c.blank) return '<div class="cal-day cd-blank"></div>';
    const row = _avState.data[c.iso];
    const cls = ['cal-day'];
    if (row?.status) cls.push('cd-'+row.status);
    if (c.iso < today) cls.push('cd-past');
    if (c.iso === today) cls.push('cd-today');
    if (_avState.selected.has(c.iso)) cls.push('cd-selected');
    return `
      <div class="${cls.join(' ')}" onclick="availDayTap('${c.iso}')">
        <div class="cal-day-num">${c.day}</div>
        ${row?.note ? `<div class="cal-day-meta">${esc(row.note.slice(0,8))}${row.note.length>8?'…':''}</div>` : ''}
      </div>
    `;
  }).join('');
  $('av-action-bar').style.display = _avState.selected.size > 0 ? '' : 'none';
}

window.availPrevMonth = function(){
  if (_avState.month === 0) { _avState.year -= 1; _avState.month = 11; }
  else _avState.month -= 1;
  _avState.selected.clear();
  renderContractorAvailability();
};
window.availNextMonth = function(){
  if (_avState.month === 11) { _avState.year += 1; _avState.month = 0; }
  else _avState.month += 1;
  _avState.selected.clear();
  renderContractorAvailability();
};
window.availDayTap = function(iso) {
  if (iso < todayISO()) { toast('Past dates are locked', {error:true}); return; }
  if (_avState.selected.size > 0) {
    if (_avState.selected.has(iso)) _avState.selected.delete(iso);
    else _avState.selected.add(iso);
    renderAvailabilityGrid();
    return;
  }
  // Single-tap cycle: free → busy → tentative → clear
  const cur = _avState.data[iso]?.status;
  const next = cur === undefined || cur === null ? 'free'
             : cur === 'free' ? 'busy'
             : cur === 'busy' ? 'tentative'
             : null;
  applyAvailability([iso], next);
};
window.availSelectAll = function(){
  const info = monthInfo(_avState.year, _avState.month);
  const today = todayISO();
  info.cells.forEach(c => { if (!c.blank && c.iso >= today) _avState.selected.add(c.iso); });
  renderAvailabilityGrid();
};
window.availSelectWeekends = function(){
  const info = monthInfo(_avState.year, _avState.month);
  const today = todayISO();
  info.cells.forEach(c => {
    if (c.blank || c.iso < today) return;
    const d = new Date(c.iso+'T12:00:00').getDay();
    if (d === 0 || d === 6) _avState.selected.add(c.iso);
  });
  renderAvailabilityGrid();
};
window.availClearSelection = function(){ _avState.selected.clear(); renderAvailabilityGrid(); };
window.availApplyStatus = async function(status){
  const dates = Array.from(_avState.selected);
  if (!dates.length) return;
  await applyAvailability(dates, status);
  _avState.selected.clear();
};
async function applyAvailability(dates, status) {
  try {
    await contractorSetAvailability(dates, status);
    if (status === null) dates.forEach(d => delete _avState.data[d]);
    else dates.forEach(d => _avState.data[d] = { the_date:d, status });
    toast(status === null ? 'Cleared' : `Marked ${status}`);
    renderAvailabilityGrid();
    session.contractor.availability_last_updated_at = new Date().toISOString();
  } catch (e) {
    toast(e.message || 'Update failed', {error:true});
  }
}
window.availPresetWeekendsFreeNext90 = async function() {
  const dates = [];
  const today = new Date();
  for (let i = 0; i < 90; i++) {
    const d = new Date(today); d.setDate(today.getDate()+i);
    if (d.getDay() === 0 || d.getDay() === 6) dates.push(isoFromDate(d));
  }
  await applyAvailability(dates, 'free');
  renderContractorAvailability();
};
window.availPresetWeekdaysBusy90 = async function() {
  const dates = [];
  const today = new Date();
  for (let i = 0; i < 90; i++) {
    const d = new Date(today); d.setDate(today.getDate()+i);
    if (d.getDay() >= 1 && d.getDay() <= 5) dates.push(isoFromDate(d));
  }
  await applyAvailability(dates, 'busy');
  renderContractorAvailability();
};
window.availPresetClear90 = async function() {
  if (!confirm('Clear all availability for the next 3 months?')) return;
  const start = todayISO();
  const end = isoFromDate(new Date(Date.now()+90*24*60*60*1000));
  try {
    const { error } = await sb.rpc('c_clear_availability', { p_start: start, p_end: end });
    if (error) throw error;
    toast('Cleared');
    renderContractorAvailability();
  } catch (e) { toast(e.message || 'Clear failed', {error:true}); }
};

  const onClockNow = timeEntries.filter(t => t.status === 'open');

    <div class="stats-grid">

      <div class="stat-card"><div class="sl">Hours YTD</div><div class="sv">${totalHours.toFixed(1)}</div><div class="sh">approved</div></div>
      <div class="stat-card"><div class="sl">Paid YTD</div><div class="sv">${fmtCur(totalPaid)}</div><div class="sh">${fmtCur(totalUnpaid)} unpaid</div></div>
      <div class="stat-card"><div class="sl">Pending approvals</div><div class="sv">${pending.length + clockPending}</div><div class="sh">${(pending.length + clockPending)?'<button class="login-link" onclick="showSection(\'a-approvals\')">Review now</button>':'all clear'}</div></div>

window.adminDeleteShiftPrompt = async function(shiftId, dateLabel) {
  const [{ count: nSign }, { count: nHours }, { data: signups }] = await Promise.all([
    sb.from('c_shift_signups').select('*', { count:'exact', head:true }).eq('shift_id', shiftId).neq('status','released'),
    sb.from('c_hour_submissions').select('*', { count:'exact', head:true }).eq('shift_id', shiftId),
    sb.from('c_shift_signups').select('contractor:c_contractors!contractor_id(email, first_name)').eq('shift_id', shiftId).eq('status','signed_up')
  ]);
  openModal('Delete shift?', `
    <p style="font-size:.92rem;margin-top:0;">Permanently delete the ${esc(dateLabel)} shift? This cannot be undone.</p>
    <ul style="font-size:.88rem;color:var(--muted);margin:8px 0 0 18px;padding:0;">
      <li>${nSign||0} signup${nSign===1?'':'s'} will be removed${(nSign||0) ? ' and those contractors emailed' : ''}.</li>
      <li>${nHours||0} hour record${nHours===1?'':'s'} on this shift will be removed.</li>
      <li>If any hours on this shift were already paid, the delete is refused. Use Cancel instead.</li>
    </ul>
  `, [
    { label:'Keep shift', cls:'btn-outline', onClick: closeModal },
    { label:'Delete shift', cls:'btn-danger', onClick: async () => {
      try {
        const { error } = await sb.rpc('c_delete_shift', { p_shift_id: shiftId });
        if (error) throw error;
        closeModal();
        toast('Shift deleted');
        const future = daysFromToday(dateLabel ? isoFromDate(new Date(dateLabel)) : todayISO()) >= 0;
        if (future && (signups||[]).length) {
          notifyMany('shift_cancelled', signups.map(x => x.contractor), c => ({
            to_email: c.email, first_name: c.first_name, bake_date: dateLabel, location: '', cancel_reason_line: 'The shift was removed from the schedule.', portal_url: PORTAL_URL
          }));
        }
        refreshActiveSection();
      } catch (e) { toast(e.message || 'Delete failed', {error:true}); }
    }}
  ]);
};

const _adminAvState = { year: new Date().getFullYear(), month: new Date().getMonth() };

async function renderAdminAvailability() {
  const el = $('sec-a-availability');
  el.innerHTML = '<div class="page-h">Availability</div><div class="page-sub">Loading…</div>';

  const start = isoFromDate(new Date(_adminAvState.year, _adminAvState.month, 1));
  const end   = isoFromDate(new Date(_adminAvState.year, _adminAvState.month + 1, 0));
  const counts = await loadAvailabilityCounts(start, end);
  const byDate = {};
  (counts||[]).forEach(c => { byDate[c.the_date] = c; });

  el.innerHTML = `
    <div class="page-h">Availability</div>
    <div class="page-sub">Who's free, when, plan bakes around your team</div>

    <div class="cal-wrap">
      <div class="cal-header">
        <button class="cal-nav-btn" onclick="adminAvailPrev()">‹</button>
        <div class="cal-month-label" id="aa-month-label"></div>
        <button class="cal-nav-btn" onclick="adminAvailNext()">›</button>
      </div>
      <div class="cal-dow-row">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="cal-grid" id="aa-grid"></div>
      <div class="cal-legend">
        <span>Tap a day to see who's free / busy and post a shift on that date.</span>
      </div>
    </div>
  `;
  renderAdminAvailabilityGrid(byDate);
}

function renderAdminAvailabilityGrid(byDate) {
  const info = monthInfo(_adminAvState.year, _adminAvState.month);
  $('aa-month-label').textContent = info.monthLabel;
  const grid = $('aa-grid');
  const today = todayISO();
  grid.innerHTML = info.cells.map(c => {
    if (c.blank) return '<div class="cal-day cd-blank"></div>';
    const counts = byDate[c.iso] || { free_count:0, busy_count:0, tentative_count:0, total_active:0 };
    const cls = ['cal-day','cd-heat'];
    if (c.iso < today) cls.push('cd-past');
    if (c.iso === today) cls.push('cd-today');
    // Heatmap color: more free = greener
    const free = counts.free_count;
    if (free >= 4)      cls.push('cd-free');
    else if (free >= 2) cls.push('cd-tentative');
    else if (free === 0 && counts.busy_count > 0) cls.push('cd-busy');
    return `
      <div class="${cls.join(' ')}" onclick="adminAvailOpenDate('${c.iso}')">
        <div class="cal-day-num">${c.day}</div>
        <div class="cd-counts">
          <span class="free-c">${counts.free_count}f</span>
          ${counts.busy_count?`· <span class="busy-c">${counts.busy_count}b</span>`:''}
        </div>
      </div>
    `;
  }).join('');
}

window.adminAvailPrev = function(){
  if (_adminAvState.month === 0) { _adminAvState.year--; _adminAvState.month = 11; }
  else _adminAvState.month--;
  renderAdminAvailability();
};
window.adminAvailNext = function(){
  if (_adminAvState.month === 11) { _adminAvState.year++; _adminAvState.month = 0; }
  else _adminAvState.month++;

// datetime-local value in Denver time for a timestamptz
function toDenverLocalInput(ts) {
  if (!ts) return '';
  const parts = new Intl.DateTimeFormat('en-US', { timeZone:'America/Denver', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false }).formatToParts(new Date(ts));
  const g = k => parts.find(p => p.type === k).value;
  return `${g('year')}-${g('month')}-${g('day')}T${g('hour') === '24' ? '00' : g('hour')}:${g('minute')}`;
}
// datetime-local (Denver wall time) back to an ISO instant
function fromDenverLocalInput(val) {
  if (!val) return null;
  const [d, t] = val.split('T'); const [y, m, dd] = d.split('-').map(Number); const [hh, mm] = t.split(':').map(Number);
  const target = Date.UTC(y, m-1, dd, hh, mm);
  let guess = target;
  for (let i = 0; i < 2; i++) {
    const p = new Intl.DateTimeFormat('en-US', { timeZone:'America/Denver', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false }).formatToParts(new Date(guess));
    const g = k => Number(p.find(x => x.type === k).value);
    const wall = Date.UTC(g('year'), g('month')-1, g('day'), g('hour') % 24, g('minute'));
    guess += (target - wall);
  }
  return new Date(guess).toISOString();
}

window.teRecalc = function(id) {
  const i = fromDenverLocalInput($('te-in-'+id).value), o = fromDenverLocalInput($('te-out-'+id).value);
  if (!i || !o) return;
  const h = Math.max(0, (new Date(o) - new Date(i)) / 3600000);
  $('te-h-'+id).value = h.toFixed(2);
  teAmt(id);
};
window.teAmt = function(id) {
  const inp = $('te-h-'+id); const rate = Number(inp.dataset.rate||0); const h = Number(inp.value||0);
  const amt = $('te-amt-'+id); if (amt) { amt.textContent = fmtCur(h*rate); const sp = amt.nextElementSibling; if (sp) sp.textContent = `(${h.toFixed(2)} hrs at ${fmtCur(rate)}/hr)`; }
  const btn = document.querySelector(`#te-card-${id} .btn-primary`); if (btn) btn.textContent = `Approve ${fmtCur(h*rate)}`;
};

window.approveTimeEntry = async function(id) {
  const h = $('te-h-'+id).value;
  if (h === '' || Number(h) < 0) { toast('Enter hours', {error:true}); return; }
  const pIn = fromDenverLocalInput($('te-in-'+id).value), pOut = fromDenverLocalInput($('te-out-'+id).value);
  if (pIn && pOut && new Date(pOut) <= new Date(pIn)) { toast('Clock-out must be after clock-in', {error:true}); return; }
  try {
    const { data: subId, error } = await sb.rpc('c_time_entry_approve', {
      p_entry_id: id, p_approved_hours: Number(h), p_admin_notes: $('te-n-'+id).value || '',
      p_clock_in: pIn, p_clock_out: pOut, p_break_minutes: 0
    });
    if (error) throw error;
    toast('Approved');
    // email the contractor using the regular hours-approved template
    const { data: sub } = await sb.from('c_hour_submissions')
      .select('*, shift:c_shifts(*), contractor:c_contractors!contractor_id(*)').eq('id', subId).single();
    if (sub && sub.contractor && sub.contractor.email && !/@pending\.lfb$/i.test(sub.contractor.email)) {
      const ytd = await loadYTDSummary();
      const myRow = (ytd||[]).find(r => r.contractor_id === sub.contractor_id) || {};
      notify('hours_approved', {
        to_email: sub.contractor.email, first_name: sub.contractor.first_name,
        bake_date: fmtDate(sub.shift.bake_date), approved_hours: String(sub.approved_hours),
        pay_rate: fmtCur(sub.approved_pay_rate), approved_amount: fmtCur(sub.approved_amount),
        admin_notes_line: sub.admin_notes ? `Note from admin: ${sub.admin_notes}` : '',
        ytd_hours: String(myRow.approved_hours||0), ytd_paid: fmtCur(myRow.paid_amount||0), ytd_pending: fmtCur(myRow.unpaid_amount||0),
        portal_url: PORTAL_URL
      });
    }
    refreshActiveSection();
  } catch (e) { toast(e.message || 'Approval failed', {error:true}); }
};

function diffJson(before, after) {
  const out = {};
  for (const k of new Set([...Object.keys(before||{}), ...Object.keys(after||{})])) {
    if (JSON.stringify(before?.[k]) !== JSON.stringify(after?.[k])) {
      out[k] = { from: before?.[k], to: after?.[k] };
    }
  }
  return Object.keys(out).length ? out : '(no field changes)';
}

// ============================================================
// CONTRACTS + E-SIGNATURE
// Templates (markdown-lite with {{merge_fields}}) → per-contractor
// contract (frozen text + SHA-256) → contractor reviews, consents,
// types name, signs via RPC (server records IP/UA/time) → signed
// PDF with signature page + audit certificate stored in the
// private contractor-documents bucket.
// ============================================================
const CONTRACT_CONSENT_TEXT =
  'I agree to use electronic records and signatures. I understand that typing my name below and clicking ' +
  '"Sign agreement" constitutes my legally binding electronic signature on this Agreement, with the same ' +
  'effect as a handwritten signature, under the U.S. ESIGN Act and the Colorado Uniform Electronic ' +
  'Transactions Act. I have read the entire Agreement, including Exhibit A, and I can download a copy at any time.';

const CONTRACT_MERGE_FIELDS = [
  { key:'contractor_name',    label:'Contractor legal name' },
  { key:'contractor_address', label:'Contractor address' },
  { key:'effective_date',     label:'Effective date (as written)' },
  { key:'pay_rate',           label:'Pay rate (as written, e.g. $19.00 (nineteen dollars))' },
  { key:'company_signer',     label:'Company signer' },
  { key:'company_title',      label:'Company signer title' }
];

function contractMerge(body, vals) {
  return String(body||'').replace(/\{\{\s*([a-z_]+)\s*\}\}/gi, (m, k) => (vals && vals[k] != null && vals[k] !== '') ? String(vals[k]) : m);
}
function contractUnfilled(body) {
  const m = String(body||'').match(/\{\{\s*[a-z_]+\s*\}\}/gi) || [];
  return [...new Set(m)];
}
function fmtLongDate(iso) {
  const d = iso ? new Date(iso + (iso.length === 10 ? 'T12:00:00' : '')) : new Date();
  return d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
}
function fmtStamp(ts) {
  if (!ts) return '-';
  return new Date(ts).toLocaleString('en-US', { timeZone:'America/Denver', year:'numeric', month:'short', day:'numeric', hour:'numeric', minute:'2-digit', timeZoneName:'short' });
}
async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

// markdown-lite → HTML (# H1, ## H2, blank-line paragraphs)
function contractToHtml(body) {
  return String(body||'').split(/\n{2,}/).map(block => {
    const t = block.trim();
    if (!t) return '';
    if (t.startsWith('## ')) {
      const [h, ...rest] = t.split('\n');
      return `<h3 class="ct-h2">${esc(h.slice(3))}</h3>` + (rest.length ? `<p class="ct-p">${esc(rest.join('\n').trim()).replace(/\n/g,'<br>')}</p>` : '');
    }
    if (t.startsWith('# '))  return t.split('\n').map(l => `<h2 class="ct-h1">${esc(l.replace(/^#\s*/,''))}</h2>`).join('');
    return `<p class="ct-p">${esc(t).replace(/\n/g,'<br>')}</p>`;
  }).join('');
}

const CONTRACT_STATUS_BADGE = { sent:'b-pending', viewed:'b-warn', signed:'b-approved', declined:'b-danger', voided:'b-inactive' };
const CONTRACT_STATUS_LABEL = { sent:'Awaiting signature', viewed:'Viewed, unsigned', signed:'Signed', declined:'Declined', voided:'Voided' };

// ---------- PDF ----------
// Text-based (searchable, small). Body + signature page + audit certificate.
async function buildContractPdf(contract, events) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'letter' });
  const W = 612, H = 792, M = 60, maxW = W - 2*M;
  let y = M;
  const footer = () => {
    const n = doc.internal.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(120);
      doc.text(`LAZAR FAMILY BAKEHOUSE LLC • ${contract.title} • Confidential`, M, H - 30);
      doc.text(`Page ${i} of ${n}`, W - M, H - 30, { align:'right' });
      doc.text(`Document ID ${contract.id}`, M, H - 18);
    }
    doc.setTextColor(0);
  };
  const need = (h) => { if (y + h > H - 50) { doc.addPage(); y = M; } };
  const para = (text, { size=10, style='normal', gap=8, align='left' } = {}) => {
    doc.setFont('helvetica', style); doc.setFontSize(size);
    const lines = doc.splitTextToSize(text, maxW);
    const lh = size * 1.35;
    for (const ln of lines) { need(lh); doc.text(ln, align==='center' ? W/2 : M, y, { align }); y += lh; }
    y += gap;
  };

  // Body
  for (const block of String(contract.body_rendered).split(/\n{2,}/)) {
    const t = block.trim(); if (!t) continue;
    if (t.startsWith('## '))     { const [h, ...rest] = t.split('\n'); para(h.slice(3), { size:11, style:'bold', gap:4 }); if (rest.length) para(rest.join(' ').trim(), { size:10 }); }
    else if (t.startsWith('# ')) { y += 6; t.split('\n').forEach(l => para(l.replace(/^#\s*/,''), { size:14, style:'bold', gap:2, align:'center' })); y += 6; }
    else                         para(t.replace(/\n/g,' '), { size:10 });
  }

  // Signature page
  doc.addPage(); y = M;
  para('LAZAR FAMILY BAKEHOUSE LLC', { size:14, style:'bold', gap:2, align:'center' });
  para(contract.title.toUpperCase(), { size:12, style:'bold', gap:2, align:'center' });
  para('*** SIGNATURE PAGE ***', { size:11, style:'bold', gap:18, align:'center' });
  para('IN WITNESS WHEREOF, the parties hereto have executed this Agreement, including Exhibit A (Statement of Work #1), as of the dates written below. This Agreement was executed electronically; the signature details and audit trail on the following page form part of the executed record.', { size:10, gap:24 });

  const sigBlock = (party, name, title, when, typed) => {
    need(120);
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text(party, M, y); y += 20;
    doc.setFont('times','italic'); doc.setFontSize(18); doc.text(typed || name || '', M + 36, y); y += 6;
    doc.setDrawColor(90); doc.line(M + 30, y, M + 330, y); y += 14;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    doc.text(`By: ${name || ''}`, M, y); y += 14;
    doc.text(`Title: ${title || ''}`, M, y); y += 14;
    doc.text(`Date: ${when ? fmtStamp(when) : ''}`, M, y); y += 14;
    doc.text(`Signed electronically`, M, y); y += 30;
  };
  sigBlock('LAZAR FAMILY BAKEHOUSE LLC', contract.company_signer_name, contract.company_signer_title, contract.company_signed_at, contract.company_signer_name);
  sigBlock('INDEPENDENT CONTRACTOR', contract.signer_typed_name, 'Independent Contractor', contract.signed_at, contract.signer_typed_name);

  // Audit certificate
  doc.addPage(); y = M;
  para('ELECTRONIC SIGNATURE CERTIFICATE', { size:13, style:'bold', gap:4, align:'center' });
  para('Audit trail generated by the Lazar Family Bakehouse Contractor Portal (contractors.lazarfamilybakehouse.com)', { size:9, gap:16, align:'center' });
  const kv = (k, v) => { need(16); doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.text(k, M, y); doc.setFont('helvetica','normal'); const lines = doc.splitTextToSize(String(v||'-'), maxW - 150); doc.text(lines, M + 150, y); y += 13 * lines.length; };
  kv('Document ID', contract.id);
  kv('Document title', contract.title);
  kv('Template version', contract.template_version != null ? `v${contract.template_version}` : '-');
  kv('Document SHA-256', contract.body_sha256);
  kv('Sent to signer', `${contract.signer_email || ''} on ${fmtStamp(contract.sent_at)}`);
  kv('First viewed', fmtStamp(contract.first_viewed_at));
  kv('Signed', fmtStamp(contract.signed_at));
  kv('Signer typed name', contract.signer_typed_name);
  kv('Signer account', `${contract.signer_email || ''} (user ${contract.signer_user_id || ''})`);
  kv('Signer IP address', contract.signer_ip);
  kv('Signer device', contract.signer_user_agent);
  kv('Company signer', `${contract.company_signer_name}, ${contract.company_signer_title} on ${fmtStamp(contract.company_signed_at)}`);
  y += 8;
  para('Consent statement accepted by signer:', { size:9, style:'bold', gap:2 });
  para(contract.consent_text || CONTRACT_CONSENT_TEXT, { size:9, gap:12 });
  para('Event log', { size:9, style:'bold', gap:2 });
  for (const e of (events||[])) {
    para(`${fmtStamp(e.at)}  ·  ${e.event.toUpperCase()}  ·  ${e.actor_email || ''}${e.ip ? '  ·  ' + e.ip : ''}`, { size:8.5, gap:1 });
  }
  footer();
  return doc.output('blob');
}

async function generateAndStoreContractPdf(contractId) {
  const { data: contract, error } = await sb.from('c_contracts').select('*').eq('id', contractId).single();
  if (error) throw error;
  const { data: events } = await sb.from('c_contract_events').select('*').eq('contract_id', contractId).order('at');
  const blob = await buildContractPdf(contract, events || []);
  const path = `${contract.contractor_id}/contracts/${contract.id}.pdf`;
  if (contract.pdf_path) { try { await sb.storage.from('contractor-documents').remove([path]); } catch (e) { /* ignore */ } }
  const { error: upErr } = await sb.storage.from('contractor-documents').upload(path, blob, { upsert:false, contentType:'application/pdf' });
  if (upErr) throw upErr;
  const { error: rpcErr } = await sb.rpc('c_contract_attach_pdf', { p_contract: contractId, p_path: path });
  if (rpcErr) throw rpcErr;
  if (!contract.pdf_path) {
    await sb.from('c_documents').insert({
      contractor_id: contract.contractor_id, document_type:'contract', file_path: path,
      file_name: `${contract.title.replace(/[^\w]+/g,'_')}_signed.pdf`, file_size_bytes: blob.size,
      mime_type:'application/pdf', uploaded_by: session.contractor.id
    });
  }
  return path;
}

window.openContractForSigning = async function(id) {
  const { data: c, error } = await sb.from('c_contracts').select('*').eq('id', id).single();
  if (error) { toast(error.message, {error:true}); return; }
  if (!['sent','viewed'].includes(c.status)) { openContractReadOnly(id); return; }
  sb.rpc('c_contract_mark_viewed', { p_contract: id }).then(()=>{});
  const legalName = `${session.contractor.first_name||''} ${session.contractor.last_name||''}`.trim();
  const clientSha = await sha256Hex(c.body_rendered);

  openModal(c.title, `
    <div class="ct-wrap">
      <p style="font-size:.86rem;color:var(--muted);margin:0 0 10px;">Please read the whole agreement. The signature section unlocks when you reach the bottom.</p>
      ${contractViewerHtml(c, { signing:true })}
      <div class="ct-signbox" id="ct-signbox">
        <label class="ct-consent"><input type="checkbox" id="ct-consent" /> <span>${esc(CONTRACT_CONSENT_TEXT)}</span></label>
        <div class="fg" style="margin-top:12px;">
          <label>Type your full legal name to sign</label>
          <input id="ct-typed" placeholder="${esc(legalName)}" autocomplete="off" style="font-family:'Playfair Display',serif;font-size:1.25rem;" />
          <div class="help">Must match your name on file: <strong>${esc(legalName)}</strong>. Contact us before signing if your legal name is different.</div>
        </div>
        <div style="font-size:.78rem;color:var(--muted);margin-top:10px;">When you sign, we record your name, email, the date and time, your IP address and device, and a fingerprint (SHA-256) of this exact document. You'll get a PDF copy immediately.</div>
      </div>
    </div>`, [
    { label:'Decline', cls:'btn-outline', onClick: () => declineContractPrompt(id) },
    { label:'Sign agreement', cls:'btn-primary', onClick: async () => {
      const typed = v('ct-typed');
      if (!$('ct-consent').checked) { toast('Please check the consent box first', {error:true}); return; }
      if (!typed) { toast('Type your full legal name to sign', {error:true}); return; }
      if (typed.toLowerCase().replace(/\s+/g,' ') !== legalName.toLowerCase().replace(/\s+/g,' ')) {
        toast(`Name must match "${legalName}" exactly`, {error:true}); return;
      }
      const btns = $('generic-modal-actions').querySelectorAll('button'); btns.forEach(b => b.disabled = true);
      try {
        const { error: e1 } = await sb.rpc('c_contract_sign', { p_contract: id, p_typed_name: typed, p_consent_text: CONTRACT_CONSENT_TEXT, p_client_sha: clientSha });
        if (e1) throw e1;
        toast('Signed. Preparing your PDF…');
        try { await generateAndStoreContractPdf(id); } catch (e) { console.warn('pdf', e); toast('Signed, but the PDF could not be saved yet. Use "Prepare PDF" to retry.', {error:true}); }
        notify('contract_signed', { to_email: ADMIN_EMAIL, contractor_name: legalName, contract_title: c.title, portal_url: PORTAL_URL });
        closeModal(); renderNotifBanner(); refreshActiveSection();
      } catch (e) { toast(e.message || 'Signing failed', {error:true}); btns.forEach(b => b.disabled = false); }
    }}
  ]);
  const modal = $('generic-modal').querySelector('.modal');
  modal.classList.add('modal-wide');
  // scroll gate: enable signing only after the bottom of the document has been on screen
  const actions = $('generic-modal-actions'); const signBtn = actions.querySelectorAll('button')[1];
  signBtn.disabled = true; $('ct-signbox').classList.add('locked');
  const sentinel = document.createElement('div'); sentinel.style.height = '1px'; $('ct-doc').appendChild(sentinel);
  const unlock = () => { signBtn.disabled = false; $('ct-signbox').classList.remove('locked'); };
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => { if (entries.some(e => e.isIntersecting)) { unlock(); io.disconnect(); } }, { root: modal, threshold: 0 });
    io.observe(sentinel);
  } else { unlock(); }
};

window.openSendContractModal = async function(contractorId) {
